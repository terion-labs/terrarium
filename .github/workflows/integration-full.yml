name: integration-full

on:
  workflow_dispatch:
    inputs:
      keep_on_failure:
        description: Leave infrastructure running for debugging
        required: false
        default: false
        type: boolean
      only:
        description: Optional scenario filter (smoke or full)
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      keep_on_failure:
        required: false
        type: boolean
        default: false
      only:
        required: false
        type: string
        default: ""
      release_preflight:
        required: false
        type: boolean
        default: false
    secrets:
      HCLOUD_TOKEN:
        required: true
      HCLOUD_LOCATION:
        required: true
      HCLOUD_SERVER_TYPE:
        required: true
      HCLOUD_SSH_PRIVATE_KEY:
        required: true
      HCLOUD_SSH_PUBLIC_KEY:
        required: true
      ZITADEL_CLOUD_ISSUER:
        required: false
      ZITADEL_CLOUD_PAT:
        required: false
      ZITADEL_CLOUD_ORG_ID:
        required: false
      LOGTO_TENANT_ENDPOINT:
        required: true
      LOGTO_M2M_CLIENT_ID:
        required: true
      LOGTO_M2M_CLIENT_SECRET:
        required: true
      LOGTO_MANAGEMENT_API_RESOURCE:
        required: false
      S3_ENDPOINT:
        required: true
      S3_BUCKET:
        required: true
      S3_REGION:
        required: true
      S3_ACCESS_KEY:
        required: true
      S3_SECRET_KEY:
        required: true
      CIFS_ADDRESS:
        required: true
      CIFS_USERNAME:
        required: true
      CIFS_PASSWORD:
        required: true
      CIFS_HOST_PATH_BASE:
        required: true

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    timeout-minutes: 360
    if: ${{ inputs.only == '' || inputs.only == 'smoke' }}
    concurrency:
      group: terrarium-integration-${{ github.workflow }}-${{ github.ref }}-smoke-${{ matrix.ubuntu }}
      cancel-in-progress: ${{ inputs.release_preflight == true }}
    env:
      HCLOUD_IMAGE: ubuntu-${{ matrix.ubuntu }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      HCLOUD_LOCATION: ${{ secrets.HCLOUD_LOCATION }}
      HCLOUD_SERVER_TYPE: ${{ secrets.HCLOUD_SERVER_TYPE }}
      HCLOUD_SSH_PRIVATE_KEY: ${{ secrets.HCLOUD_SSH_PRIVATE_KEY }}
      HCLOUD_SSH_PUBLIC_KEY: ${{ secrets.HCLOUD_SSH_PUBLIC_KEY }}
      TERRARIUM_INTEGRATION_IDP_PROVIDER: ${{ inputs.release_preflight && 'logto' || '' }}
      ZITADEL_CLOUD_ISSUER: ${{ secrets.ZITADEL_CLOUD_ISSUER }}
      ZITADEL_CLOUD_PAT: ${{ secrets.ZITADEL_CLOUD_PAT }}
      ZITADEL_CLOUD_ORG_ID: ${{ secrets.ZITADEL_CLOUD_ORG_ID }}
      LOGTO_TENANT_ENDPOINT: ${{ secrets.LOGTO_TENANT_ENDPOINT }}
      LOGTO_M2M_CLIENT_ID: ${{ secrets.LOGTO_M2M_CLIENT_ID }}
      LOGTO_M2M_CLIENT_SECRET: ${{ secrets.LOGTO_M2M_CLIENT_SECRET }}
      LOGTO_MANAGEMENT_API_RESOURCE: ${{ secrets.LOGTO_MANAGEMENT_API_RESOURCE }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      CIFS_ADDRESS: ${{ secrets.CIFS_ADDRESS }}
      CIFS_USERNAME: ${{ secrets.CIFS_USERNAME }}
      CIFS_PASSWORD: ${{ secrets.CIFS_PASSWORD }}
      CIFS_HOST_PATH_BASE: ${{ secrets.CIFS_HOST_PATH_BASE }}
      TERRARIUM_INTEGRATION_IP_DNS_DOMAIN: ${{ vars.TERRARIUM_INTEGRATION_IP_DNS_DOMAIN || 'nip.io' }}
      TERRARIUM_INTEGRATION_SLUG: gha-${{ github.run_id }}-${{ github.run_attempt }}-smoke-${{ matrix.ubuntu }}
      TERRARIUM_INTEGRATION_OUTPUT_DIR: ${{ github.workspace }}/tests/integration/output/smoke-${{ matrix.ubuntu }}
      KEEP_ON_FAILURE: ${{ inputs.keep_on_failure && 'true' || 'false' }}
      RELEASE_PREFLIGHT: ${{ inputs.release_preflight && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client tar
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Generate integration SSH key
        run: |
          ssh-keygen -t ed25519 -N "" -C "terrarium-${TERRARIUM_INTEGRATION_SLUG}" -f "${RUNNER_TEMP}/terrarium-integration-id_ed25519"
          chmod 600 "${RUNNER_TEMP}/terrarium-integration-id_ed25519"
          {
            echo "HCLOUD_SSH_PRIVATE_KEY_FILE=${RUNNER_TEMP}/terrarium-integration-id_ed25519"
            echo "HCLOUD_SSH_PUBLIC_KEY_FILE=${RUNNER_TEMP}/terrarium-integration-id_ed25519.pub"
          } >> "${GITHUB_ENV}"
      - name: Run smoke suite
        run: |
          if [ "${RELEASE_PREFLIGHT}" = "true" ]; then
            bun run tests/integration/index.ts --suite smoke --release-preflight
          else
            bun run tests/integration/index.ts --suite smoke
          fi
      - name: Upload smoke integration output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-smoke-output-${{ matrix.ubuntu }}
          path: ${{ env.TERRARIUM_INTEGRATION_OUTPUT_DIR }}
          if-no-files-found: warn

  post_smoke:
    name: post-smoke
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Each scenario needs two hosts; keep the combined smoke/full peak at six.
      max-parallel: 1
      matrix:
        ubuntu: ["24.04", "26.04"]
    timeout-minutes: 360
    if: ${{ inputs.only == '' || inputs.only == 'full' }}
    concurrency:
      group: terrarium-integration-${{ github.workflow }}-${{ github.ref }}-post-smoke-${{ matrix.ubuntu }}
      cancel-in-progress: ${{ inputs.release_preflight == true }}
    env:
      HCLOUD_IMAGE: ubuntu-${{ matrix.ubuntu }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      HCLOUD_LOCATION: ${{ secrets.HCLOUD_LOCATION }}
      HCLOUD_SERVER_TYPE: ${{ secrets.HCLOUD_SERVER_TYPE }}
      HCLOUD_SSH_PRIVATE_KEY: ${{ secrets.HCLOUD_SSH_PRIVATE_KEY }}
      HCLOUD_SSH_PUBLIC_KEY: ${{ secrets.HCLOUD_SSH_PUBLIC_KEY }}
      TERRARIUM_INTEGRATION_IDP_PROVIDER: ${{ inputs.release_preflight && 'logto' || '' }}
      ZITADEL_CLOUD_ISSUER: ${{ secrets.ZITADEL_CLOUD_ISSUER }}
      ZITADEL_CLOUD_PAT: ${{ secrets.ZITADEL_CLOUD_PAT }}
      ZITADEL_CLOUD_ORG_ID: ${{ secrets.ZITADEL_CLOUD_ORG_ID }}
      LOGTO_TENANT_ENDPOINT: ${{ secrets.LOGTO_TENANT_ENDPOINT }}
      LOGTO_M2M_CLIENT_ID: ${{ secrets.LOGTO_M2M_CLIENT_ID }}
      LOGTO_M2M_CLIENT_SECRET: ${{ secrets.LOGTO_M2M_CLIENT_SECRET }}
      LOGTO_MANAGEMENT_API_RESOURCE: ${{ secrets.LOGTO_MANAGEMENT_API_RESOURCE }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      CIFS_ADDRESS: ${{ secrets.CIFS_ADDRESS }}
      CIFS_USERNAME: ${{ secrets.CIFS_USERNAME }}
      CIFS_PASSWORD: ${{ secrets.CIFS_PASSWORD }}
      CIFS_HOST_PATH_BASE: ${{ secrets.CIFS_HOST_PATH_BASE }}
      TERRARIUM_INTEGRATION_IP_DNS_DOMAIN: ${{ vars.TERRARIUM_INTEGRATION_IP_DNS_DOMAIN || 'nip.io' }}
      TERRARIUM_INTEGRATION_SLUG: gha-${{ github.run_id }}-${{ github.run_attempt }}-post-smoke-${{ matrix.ubuntu }}
      TERRARIUM_INTEGRATION_OUTPUT_DIR: ${{ github.workspace }}/tests/integration/output/post-smoke-${{ matrix.ubuntu }}
      KEEP_ON_FAILURE: ${{ inputs.keep_on_failure && 'true' || 'false' }}
      RELEASE_PREFLIGHT: ${{ inputs.release_preflight && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client tar
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Generate integration SSH key
        run: |
          ssh-keygen -t ed25519 -N "" -C "terrarium-${TERRARIUM_INTEGRATION_SLUG}" -f "${RUNNER_TEMP}/terrarium-integration-id_ed25519"
          chmod 600 "${RUNNER_TEMP}/terrarium-integration-id_ed25519"
          {
            echo "HCLOUD_SSH_PRIVATE_KEY_FILE=${RUNNER_TEMP}/terrarium-integration-id_ed25519"
            echo "HCLOUD_SSH_PUBLIC_KEY_FILE=${RUNNER_TEMP}/terrarium-integration-id_ed25519.pub"
          } >> "${GITHUB_ENV}"
      - name: Run post-smoke suite
        run: |
          if [ "${RELEASE_PREFLIGHT}" = "true" ]; then
            bun run tests/integration/index.ts --suite full --release-preflight --only full
          else
            bun run tests/integration/index.ts --suite full --only full
          fi
      - name: Upload post-smoke integration output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-post-smoke-output-${{ matrix.ubuntu }}
          path: ${{ env.TERRARIUM_INTEGRATION_OUTPUT_DIR }}
          if-no-files-found: warn
