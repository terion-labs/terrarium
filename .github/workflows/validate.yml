name: validate

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  libzfs:
    name: Python ZFS binding (${{ matrix.ubuntu }}, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: ubuntu:${{ matrix.ubuntu }}
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
      ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible
        run: |
          apt-get update
          apt-get install -y python3-venv ca-certificates
          python3 -m venv /opt/test-ansible
          /opt/test-ansible/bin/pip install ansible==13.7.0
      - name: Build and exercise the native binding
        run: /opt/test-ansible/bin/ansible-playbook -i localhost, tests/integration/libzfs-build.yml
      - name: Verify reconciliation does not rebuild an unchanged binding
        run: |
          /opt/test-ansible/bin/ansible-playbook -i localhost, tests/integration/libzfs-build.yml > /tmp/libzfs-repeat.log
          cat /tmp/libzfs-repeat.log
          grep -E 'localhost.*changed=0 .*failed=0' /tmp/libzfs-repeat.log

  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv .ansible-venv
          .ansible-venv/bin/python -m pip install --upgrade pip
          .ansible-venv/bin/python -m pip install --upgrade ansible==13.7.0 passlib==1.7.4
          echo "$PWD/.ansible-venv/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/.ansible-venv/bin:$PATH"
          bun install
          bunx playwright install --with-deps chromium
          bun run build
          bun run docs:build
          cd ansible
          for attempt in 1 2 3 4; do
            if ansible-galaxy collection install -r requirements.yml; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Script validation
        run: |
          bash -n install.sh
          test -x dist/terrariumctl
          bun run tests/integration/index.ts --help
          bun run integration:vm --help
      - name: Typecheck and unit tests
        run: |
          bun run typecheck
          bun test
      - name: Ansible syntax
        run: |
          cd ansible
          ansible-playbook -i inventory.ini site.yml --syntax-check
