- name: Configure Terrarium oauth2-proxy
  when: terrarium_oauth2_proxy_enabled | bool
  block:
    - name: Install oauth2-proxy runtime packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
        name:
          - docker.io
        state: present
      register: terrarium_oauth2_proxy_runtime_install
      until: terrarium_oauth2_proxy_runtime_install is succeeded
      retries: 3
      delay: 10

    - name: Install Docker Compose v2 package for oauth2-proxy
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
        name: docker-compose-v2
        state: present
      register: terrarium_oauth2_proxy_compose_v2_install
      until: terrarium_oauth2_proxy_compose_v2_install is succeeded
      retries: 3
      delay: 10
      ignore_errors: true

    - name: Install Docker Compose plugin fallback for oauth2-proxy
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
        name: docker-compose-plugin
        state: present
      register: terrarium_oauth2_proxy_compose_plugin_install
      until: terrarium_oauth2_proxy_compose_plugin_install is succeeded
      retries: 3
      delay: 10
      when: terrarium_oauth2_proxy_compose_v2_install is failed

    - name: Enable Docker for oauth2-proxy
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Check Docker registry credentials for oauth2-proxy image
      ansible.builtin.stat:
        path: "{{ terrarium_docker_registry_config_path }}"
      register: terrarium_oauth2_proxy_docker_registry_config
      when: terrarium_oauth2_proxy_image_effective is not defined
      no_log: true

    - name: Resolve oauth2-proxy image
      ansible.builtin.set_fact:
        terrarium_oauth2_proxy_image_effective: >-
          {{
            terrarium_oauth2_proxy_image | terrarium_image_publisher
            if (terrarium_oauth2_proxy_image | default('', true) | length > 0)
            else (
              terrarium_oauth2_proxy_image_hardened
              if (
                (terrarium_docker_hardened_images | string | lower) in ['true', 'yes', '1']
                or (
                  (terrarium_docker_hardened_images | string | lower) == 'auto'
                  and (terrarium_oauth2_proxy_docker_registry_config.stat.exists | default(false))
                )
              )
              else (
                terrarium_oauth2_proxy_image_mirror
                if (
                  (terrarium_docker_hardened_images | string | lower) not in ['false', 'no', '0']
                  and (terrarium_docker_hardened_image_mirrors | string | lower) in ['true', 'yes', '1', 'auto']
                )
                else terrarium_oauth2_proxy_image_fallback
              )
            )
          }}
      when: terrarium_oauth2_proxy_image_effective is not defined
      no_log: true

    - name: Ensure oauth2-proxy host group
      ansible.builtin.group:
        name: "{{ terrarium_oauth2_proxy_group }}"
        gid: "{{ (terrarium_oauth2_proxy_gid | default('', true) | string | length > 0) | ternary(terrarium_oauth2_proxy_gid, omit) }}"
        system: true
        state: present

    - name: Resolve oauth2-proxy host group
      ansible.builtin.getent:
        database: group
        key: "{{ terrarium_oauth2_proxy_group }}"
      when: terrarium_oauth2_proxy_gid_effective is not defined

    - name: Set oauth2-proxy host GID
      ansible.builtin.set_fact:
        terrarium_oauth2_proxy_gid_effective: "{{ ansible_facts.getent_group[terrarium_oauth2_proxy_group][1] }}"
      when: terrarium_oauth2_proxy_gid_effective is not defined

    - name: Create oauth2-proxy directories
      ansible.builtin.file:
        path: "{{ terrarium_oauth2_proxy_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Generate oauth2-proxy cookie secret
      ansible.builtin.shell: |
        umask 077
        python3 - <<'PY' > {{ terrarium_oauth2_proxy_cookie_secret_path }}
        import secrets
        import string

        alphabet = string.ascii_letters + string.digits
        print("".join(secrets.choice(alphabet) for _ in range(32)))
        PY
      args:
        creates: "{{ terrarium_oauth2_proxy_cookie_secret_path }}"

    - name: Read existing oauth2-proxy cookie secret for validation
      ansible.builtin.command: cat {{ terrarium_oauth2_proxy_cookie_secret_path }}
      register: terrarium_oauth2_proxy_cookie_secret_existing
      changed_when: false

    - name: Regenerate invalid oauth2-proxy cookie secret
      ansible.builtin.shell: |
        umask 077
        python3 - <<'PY' > {{ terrarium_oauth2_proxy_cookie_secret_path }}
        import secrets
        import string

        alphabet = string.ascii_letters + string.digits
        print("".join(secrets.choice(alphabet) for _ in range(32)))
        PY
      when:
        - terrarium_oauth2_proxy_cookie_secret_existing.stdout | trim | length not in [16, 24, 32]

    - name: Read oauth2-proxy cookie secret
      ansible.builtin.command: cat {{ terrarium_oauth2_proxy_cookie_secret_path }}
      register: terrarium_oauth2_proxy_cookie_secret_raw
      changed_when: false

    - name: Resolve local IdP output path for oauth2-proxy
      ansible.builtin.set_fact:
        terrarium_oauth2_proxy_local_idp_outputs_path_effective: >-
          {{
            (terrarium_local_idp_outputs_path_effective | default('', true) | string | trim)
            if (terrarium_local_idp_outputs_path_effective | default('', true) | string | trim | length > 0)
            else (
              (terrarium_local_idp_outputs_path | default('', true) | string | trim)
              if (terrarium_local_idp_outputs_path | default('', true) | string | trim | length > 0)
              else (
                (terrarium_local_idp_outputs_path_default | default('/etc/terrarium/idp-apps.json', true))
                if (terrarium_idp_provider_effective | default(terrarium_idp_provider | default('', true), true) | string | trim | lower) == 'logto'
                else (
                  (terrarium_zitadel_outputs_path_effective | default('', true) | string | trim)
                  if (terrarium_zitadel_outputs_path_effective | default('', true) | string | trim | length > 0)
                  else (
                    (terrarium_zitadel_outputs_path | default('', true) | string | trim)
                    if (terrarium_zitadel_outputs_path | default('', true) | string | trim | length > 0)
                    else '/etc/terrarium/zitadel-apps.json'
                  )
                )
              )
            )
          }}
      when: terrarium_idp_mode == 'local'

    - name: Read local IdP application outputs for oauth2-proxy
      ansible.builtin.slurp:
        src: "{{ terrarium_oauth2_proxy_local_idp_outputs_path_effective }}"
      register: terrarium_oauth2_proxy_local_idp_outputs_raw
      when:
        - terrarium_idp_mode == 'local'
        - terrarium_oauth2_proxy_local_idp_outputs_path_effective | default('', true) | length > 0
      no_log: true

    - name: Parse local IdP application outputs for oauth2-proxy
      ansible.builtin.set_fact:
        terrarium_oauth2_proxy_local_idp_outputs: "{{ terrarium_oauth2_proxy_local_idp_outputs_raw.content | b64decode | from_json }}"
      when:
        - terrarium_idp_mode == 'local'
        - terrarium_oauth2_proxy_local_idp_outputs_raw is defined
        - terrarium_oauth2_proxy_local_idp_outputs_raw.content is defined
      no_log: true

    - name: Resolve oauth2-proxy OIDC client settings
      ansible.builtin.set_fact:
        terrarium_oauth2_proxy_client_id_effective: >-
          {{
            (
              terrarium_oauth2_proxy_local_idp_outputs.cockpit_client_id.value
              if terrarium_idp_mode == 'local'
              else terrarium_oidc_client_id
            ) | default('', true)
          }}
        terrarium_oauth2_proxy_client_secret_effective: >-
          {{
            (
              terrarium_oauth2_proxy_local_idp_outputs.cockpit_client_secret.value
              if terrarium_idp_mode == 'local'
              else terrarium_oidc_client_secret
            ) | default('', true)
          }}
        terrarium_oauth2_proxy_oidc_issuer_effective: >-
          {{
            (
              (
                terrarium_oidc_issuer_effective | default(terrarium_oidc_issuer | default('', true), true)
              )
              if (
                terrarium_idp_mode == 'local'
                and (terrarium_idp_provider_effective | default(terrarium_idp_provider | default('', true), true) | string | trim | lower) == 'logto'
              )
              else (
                (
                  terrarium_oauth2_proxy_local_idp_outputs.issuer.value
                  | default(terrarium_oidc_issuer_effective | default('', true), true)
                )
                if terrarium_idp_mode == 'local'
                else (
                  terrarium_oidc_issuer_effective | default(terrarium_oidc_issuer | default('', true), true)
                )
              )
            ) | default('', true)
          }}
      no_log: true

    - name: Assert local Logto oauth2-proxy issuer uses OIDC path
      ansible.builtin.assert:
        that:
          - (terrarium_oauth2_proxy_oidc_issuer_effective | string) is search('/oidc$')
        fail_msg: local Logto oauth2-proxy issuer must end with /oidc; refusing to render root issuer
      when:
        - terrarium_idp_mode == 'local'
        - (terrarium_idp_provider_effective | default(terrarium_idp_provider | default('', true), true) | string | trim | lower) == 'logto'

    - name: Assert oauth2-proxy client credentials are present
      ansible.builtin.assert:
        that:
          - terrarium_oauth2_proxy_client_id_effective | length > 0
          - terrarium_oauth2_proxy_client_secret_effective | length > 0
          - terrarium_oauth2_proxy_oidc_issuer_effective | length > 0
          - terrarium_admin_group | length > 0
        fail_msg: oauth2-proxy requires an OIDC issuer, client credentials, and terrarium_admin_group

    - name: Render oauth2-proxy config
      ansible.builtin.template:
        src: oauth2-proxy.cfg.j2
        dest: "{{ terrarium_oauth2_proxy_dir }}/oauth2-proxy.cfg"
        owner: root
        group: "{{ terrarium_oauth2_proxy_group }}"
        mode: "0640"
      vars:
        terrarium_oauth2_proxy_client_id: "{{ terrarium_oauth2_proxy_client_id_effective }}"
        terrarium_oauth2_proxy_client_secret: "{{ terrarium_oauth2_proxy_client_secret_effective }}"
        terrarium_oauth2_proxy_oidc_issuer: "{{ terrarium_oauth2_proxy_oidc_issuer_effective }}"
        terrarium_oauth2_proxy_cookie_secret: "{{ terrarium_oauth2_proxy_cookie_secret_raw.stdout }}"
      no_log: true
      notify: restart terrarium oauth2 proxy

    - name: Render oauth2-proxy compose stack
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ terrarium_oauth2_proxy_dir }}/docker-compose.yml"
        mode: "0600"
      notify: restart terrarium oauth2 proxy

    - name: Render oauth2-proxy systemd unit
      ansible.builtin.template:
        src: terrarium-oauth2-proxy.service.j2
        dest: /etc/systemd/system/terrarium-oauth2-proxy.service
        mode: "0644"
      notify:
        - reload terrarium oauth2 proxy systemd
        - restart terrarium oauth2 proxy

    - name: Flush oauth2-proxy handlers
      ansible.builtin.meta: flush_handlers

    - name: Enable oauth2-proxy compose service
      ansible.builtin.systemd:
        name: terrarium-oauth2-proxy.service
        state: started
        enabled: true

- name: Disable oauth2-proxy when Terrarium auth is disabled
  when: not (terrarium_oauth2_proxy_enabled | bool)
  block:
    - name: Stop and disable oauth2-proxy compose service
      ansible.builtin.systemd:
        name: terrarium-oauth2-proxy.service
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove oauth2-proxy systemd unit
      ansible.builtin.file:
        path: /etc/systemd/system/terrarium-oauth2-proxy.service
        state: absent
      notify: reload terrarium oauth2 proxy systemd
