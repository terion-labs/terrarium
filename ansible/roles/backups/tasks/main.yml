- name: Install backup packages
  ansible.builtin.apt:
    name:
      - mbuffer
      - sanoid
      - zstd
    state: present

- name: Install S3 backup packages
  ansible.builtin.apt:
    name:
      - awscli
    state: present
  register: terrarium_awscli_apt_install
  ignore_errors: true
  when: terrarium_enable_s3

- name: Map AWS CLI fallback architecture
  ansible.builtin.set_fact:
    terrarium_awscli_arch: >-
      {{
        {
          'x86_64': 'x86_64',
          'amd64': 'x86_64',
          'aarch64': 'aarch64',
          'arm64': 'aarch64'
        }[ansible_architecture] | default(ansible_architecture)
      }}
  when:
    - terrarium_enable_s3
    - terrarium_awscli_apt_install is failed

- name: Compute AWS CLI fallback archive metadata
  ansible.builtin.set_fact:
    terrarium_awscli_archive: "awscli-exe-linux-{{ terrarium_awscli_arch }}-{{ terrarium_awscli_version }}.zip"
    terrarium_awscli_archive_checksum: "{{ terrarium_awscli_sha256[terrarium_awscli_arch] }}"
  when:
    - terrarium_enable_s3
    - terrarium_awscli_apt_install is failed

- name: Install AWS CLI fallback prerequisites
  ansible.builtin.apt:
    name:
      - unzip
    state: present
  when:
    - terrarium_enable_s3
    - terrarium_awscli_apt_install is failed

- name: Create private AWS CLI fallback work directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ terrarium_awscli_download_dir }}"
    - "{{ terrarium_awscli_stage_dir }}"
  when:
    - terrarium_enable_s3
    - terrarium_awscli_apt_install is failed

- name: Download AWS CLI v2 fallback archive
  ansible.builtin.get_url:
    url: "https://awscli.amazonaws.com/{{ terrarium_awscli_archive }}"
    dest: "{{ terrarium_awscli_download_dir }}/{{ terrarium_awscli_archive }}"
    checksum: "sha256:{{ terrarium_awscli_archive_checksum }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - terrarium_enable_s3
    - terrarium_awscli_apt_install is failed

- name: Remove extracted AWS CLI fallback directory
  ansible.builtin.file:
    path: "{{ terrarium_awscli_stage_dir }}/aws"
    state: absent
  when:
    - terrarium_enable_s3
    - terrarium_awscli_apt_install is failed

- name: Validate AWS CLI v2 fallback archive metadata
  ansible.builtin.shell: |
    set -euo pipefail
    archive="{{ terrarium_awscli_download_dir }}/{{ terrarium_awscli_archive }}"

    unzip -Z1 "$archive" | while IFS= read -r member; do
      [ -n "$member" ] || continue
      case "$member" in
        /*|../*|*/../*|*/..|..)
          echo "unsafe archive member path: $member" >&2
          exit 1
          ;;
      esac
      case "$member" in
        aws|aws/*) ;;
        *)
          echo "archive member outside aws installer tree: $member" >&2
          exit 1
          ;;
      esac
    done

    unzip -Zl "$archive" | awk '$1 ~ /^[lbcps]/ { print "unsafe archive member type: " $0 > "/dev/stderr"; bad = 1 } END { exit bad ? 1 : 0 }'
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - terrarium_enable_s3
    - terrarium_awscli_apt_install is failed

- name: Extract AWS CLI v2 fallback archive into private staging
  ansible.builtin.command:
    argv:
      - unzip
      - -q
      - "{{ terrarium_awscli_download_dir }}/{{ terrarium_awscli_archive }}"
      - -d
      - "{{ terrarium_awscli_stage_dir }}"
  when:
    - terrarium_enable_s3
    - terrarium_awscli_apt_install is failed

- name: Install AWS CLI v2 fallback
  ansible.builtin.command:
    cmd: "{{ terrarium_awscli_stage_dir }}/aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update"
  when:
    - terrarium_enable_s3
    - terrarium_awscli_apt_install is failed

- name: Ensure backup directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/sanoid
    - "{{ terrarium_state_dir }}/catalog"
    - "{{ terrarium_state_dir }}/lastsnapshots"
    - "{{ terrarium_state_dir }}/restore"

- name: Inspect local LXD member identity for backup storage
  ansible.builtin.command:
    argv: [/snap/bin/lxc, query, /1.0]
  register: terrarium_backup_server
  changed_when: false

- name: Discover the local physical ZFS storage root
  ansible.builtin.command:
    argv: "{{ ['/snap/bin/lxc', 'storage', 'get', terrarium_lxd_pool_name, 'zfs.pool_name'] + (['--target', (terrarium_backup_server.stdout | from_json).environment.server_name] if (terrarium_backup_server.stdout | from_json).environment.server_clustered else []) }}"
  register: terrarium_backup_pool
  changed_when: false

- name: Record physical ZFS root independently of LXD pool label
  ansible.builtin.set_fact:
    terrarium_backup_zfs_root: "{{ terrarium_backup_pool.stdout | trim }}"

- name: Validate physical ZFS root
  ansible.builtin.assert:
    that:
      - terrarium_backup_zfs_root | length > 0
    fail_msg: LXD did not report zfs.pool_name for the local backup pool

- name: Render sanoid config
  ansible.builtin.template:
    src: sanoid.conf.j2
    dest: /etc/sanoid/sanoid.conf
    mode: "0644"

- name: Render terrarium S3 env file
  ansible.builtin.copy:
    dest: /etc/terrarium/s3.env
    mode: "0600"
    content: |
      AWS_ACCESS_KEY_ID={{ terrarium_s3_access_key }}
      AWS_SECRET_ACCESS_KEY={{ terrarium_s3_secret_key }}
      AWS_DEFAULT_REGION={{ terrarium_s3_region }}
  when: terrarium_enable_s3
  no_log: true

- name: Install S3 backup systemd service
  ansible.builtin.template:
    src: terrarium-s3-backup.service.j2
    dest: /etc/systemd/system/terrarium-s3-backup.service
    mode: "0644"
  when: terrarium_enable_s3
  notify: reload systemd

- name: Install S3 backup timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/terrarium-s3-backup.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Run Terrarium S3 exports

      [Timer]
      OnCalendar=hourly
      Persistent=true

      [Install]
      WantedBy=timers.target
  when: terrarium_enable_s3
  notify: reload systemd

- name: Enable S3 backup timer
  ansible.builtin.systemd:
    name: terrarium-s3-backup.timer
    enabled: true
    state: started
  when: terrarium_enable_s3

- name: Disable S3 backup timer when not configured
  ansible.builtin.systemd:
    name: terrarium-s3-backup.timer
    enabled: false
    state: stopped
  failed_when: false
  when: not terrarium_enable_s3

- name: Install syncoid service
  ansible.builtin.template:
    src: terrarium-syncoid.service.j2
    dest: /etc/systemd/system/terrarium-syncoid.service
    mode: "0644"
  when: terrarium_enable_syncoid
  notify: reload systemd

- name: Install syncoid timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/terrarium-syncoid.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Run Terrarium syncoid replication

      [Timer]
      OnCalendar=hourly
      Persistent=true

      [Install]
      WantedBy=timers.target
  when: terrarium_enable_syncoid
  notify: reload systemd

- name: Enable syncoid timer
  ansible.builtin.systemd:
    name: terrarium-syncoid.timer
    enabled: true
    state: started
  when: terrarium_enable_syncoid

- name: Disable syncoid timer when not configured
  ansible.builtin.systemd:
    name: terrarium-syncoid.timer
    enabled: false
    state: stopped
  failed_when: false
  when: not terrarium_enable_syncoid
