- name: Install Python ZFS binding for the host distribution
  ansible.builtin.import_tasks: libzfs.yml

- name: Install Cockpit plugin runtime dependencies
  ansible.builtin.apt:
    name: "{{ terrarium_cockpit_plugin_runtime_deps }}"
    state: present

- name: Map Cockpit plugin bundle architecture
  ansible.builtin.set_fact:
    terrarium_cockpit_plugin_bundle_arch: >-
      {{
        {
          'x86_64': 'amd64',
          'aarch64': 'arm64'
        }.get(ansible_architecture, '')
      }}

- name: Compute sanitized Cockpit plugin refs
  ansible.builtin.set_fact:
    terrarium_cockpit_zfs_ref_safe: "{{ terrarium_cockpit_zfs_ref | regex_replace('[^A-Za-z0-9._-]+', '-') }}"
    terrarium_cockpit_s3_ref_safe: "{{ terrarium_cockpit_s3_ref | regex_replace('[^A-Za-z0-9._-]+', '-') }}"
    terrarium_cockpit_zfs_bundle_release: "cockpit-plugin-zfs-{{ terrarium_cockpit_zfs_ref | regex_replace('[^A-Za-z0-9._-]+', '-') }}"
    terrarium_cockpit_s3_bundle_release: "cockpit-plugin-s3-{{ terrarium_cockpit_s3_ref | regex_replace('[^A-Za-z0-9._-]+', '-') }}"

- name: Compute versioned Cockpit plugin bundle filenames
  ansible.builtin.set_fact:
    terrarium_cockpit_zfs_bundle_filename: >-
      cockpit-plugin-zfs-{{ terrarium_cockpit_zfs_ref_safe }}-linux-{{ terrarium_cockpit_plugin_bundle_arch }}.tar.gz
    terrarium_cockpit_s3_bundle_filename: >-
      cockpit-plugin-s3-{{ terrarium_cockpit_s3_ref_safe }}-linux-{{ terrarium_cockpit_plugin_bundle_arch }}.tar.gz

- name: Compute Cockpit plugin bundle URLs
  ansible.builtin.set_fact:
    terrarium_cockpit_zfs_bundle_url: >-
      https://github.com/{{ terrarium_cockpit_plugin_bundle_repo }}/releases/download/{{ terrarium_cockpit_zfs_bundle_release }}/{{ terrarium_cockpit_zfs_bundle_filename }}
    terrarium_cockpit_s3_bundle_url: >-
      https://github.com/{{ terrarium_cockpit_plugin_bundle_repo }}/releases/download/{{ terrarium_cockpit_s3_bundle_release }}/{{ terrarium_cockpit_s3_bundle_filename }}
    terrarium_cockpit_zfs_bundle_checksum: "{{ terrarium_cockpit_zfs_bundle_sha256[terrarium_cockpit_plugin_bundle_arch] | default('') }}"
    terrarium_cockpit_s3_bundle_checksum: "{{ terrarium_cockpit_s3_bundle_sha256[terrarium_cockpit_plugin_bundle_arch] | default('') }}"

- name: Create private Cockpit plugin bundle work directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ terrarium_cockpit_plugin_download_dir }}"
    - "{{ terrarium_cockpit_plugin_stage_dir }}"

- name: Check cockpit-zfs install
  ansible.builtin.stat:
    path: /usr/share/cockpit/zfs/index.html
  register: terrarium_cockpit_zfs_installed

- name: Check cockpit-s3-browser install
  ansible.builtin.stat:
    path: /usr/share/cockpit/cockpit-s3-browser/index.html
  register: terrarium_cockpit_s3_installed

- name: Download prebuilt cockpit-zfs bundle
  ansible.builtin.get_url:
    url: "{{ terrarium_cockpit_zfs_bundle_url }}"
    dest: "{{ terrarium_cockpit_plugin_download_dir }}/{{ terrarium_cockpit_zfs_bundle_release }}-{{ terrarium_cockpit_zfs_bundle_filename }}"
    checksum: "sha256:{{ terrarium_cockpit_zfs_bundle_checksum }}"
    owner: root
    group: root
    mode: "0600"
  register: terrarium_cockpit_zfs_bundle_download
  ignore_errors: true
  when:
    - terrarium_cockpit_plugin_bundle_enabled
    - terrarium_cockpit_plugin_bundle_arch | length > 0
    - terrarium_cockpit_zfs_bundle_checksum | length > 0

- name: Download prebuilt cockpit-s3 bundle
  ansible.builtin.get_url:
    url: "{{ terrarium_cockpit_s3_bundle_url }}"
    dest: "{{ terrarium_cockpit_plugin_download_dir }}/{{ terrarium_cockpit_s3_bundle_release }}-{{ terrarium_cockpit_s3_bundle_filename }}"
    checksum: "sha256:{{ terrarium_cockpit_s3_bundle_checksum }}"
    owner: root
    group: root
    mode: "0600"
  register: terrarium_cockpit_s3_bundle_download
  ignore_errors: true
  when:
    - terrarium_cockpit_plugin_bundle_enabled
    - terrarium_cockpit_plugin_bundle_arch | length > 0
    - terrarium_cockpit_s3_bundle_checksum | length > 0

- name: Check downloaded cockpit-zfs bundle
  ansible.builtin.stat:
    path: "{{ terrarium_cockpit_zfs_bundle_download.dest }}"
  register: terrarium_cockpit_zfs_bundle_file
  when:
    - terrarium_cockpit_zfs_bundle_download is defined
    - terrarium_cockpit_zfs_bundle_download.dest is defined

- name: Check downloaded cockpit-s3 bundle
  ansible.builtin.stat:
    path: "{{ terrarium_cockpit_s3_bundle_download.dest }}"
  register: terrarium_cockpit_s3_bundle_file
  when:
    - terrarium_cockpit_s3_bundle_download is defined
    - terrarium_cockpit_s3_bundle_download.dest is defined

- name: Validate prebuilt cockpit-zfs bundle metadata
  ansible.builtin.shell: |
    set -euo pipefail
    archive="{{ terrarium_cockpit_zfs_bundle_download.dest }}"
    allowed="usr/share/cockpit/zfs"

    tar -tzf "$archive" | while IFS= read -r member; do
      [ -n "$member" ] || continue
      case "$member" in
        /*|../*|*/../*|*/..|..)
          echo "unsafe archive member path: $member" >&2
          exit 1
          ;;
      esac
      case "$member" in
        "$allowed"|"$allowed"/*) ;;
        *)
          echo "archive member outside $allowed: $member" >&2
          exit 1
          ;;
      esac
    done

    tar -tvzf "$archive" | awk '$1 ~ /^[hlbcps]/ { print "unsafe archive member type: " $0 > "/dev/stderr"; bad = 1 } END { exit bad ? 1 : 0 }'
  register: terrarium_cockpit_zfs_bundle_paths
  changed_when: false
  ignore_errors: true
  args:
    executable: /bin/bash
  when:
    - terrarium_cockpit_zfs_bundle_download is defined
    - terrarium_cockpit_zfs_bundle_download.dest is defined
    - terrarium_cockpit_zfs_bundle_file.stat.exists | default(false)

- name: Validate prebuilt cockpit-s3 bundle metadata
  ansible.builtin.shell: |
    set -euo pipefail
    archive="{{ terrarium_cockpit_s3_bundle_download.dest }}"
    allowed="usr/share/cockpit/cockpit-s3-browser"

    tar -tzf "$archive" | while IFS= read -r member; do
      [ -n "$member" ] || continue
      case "$member" in
        /*|../*|*/../*|*/..|..)
          echo "unsafe archive member path: $member" >&2
          exit 1
          ;;
      esac
      case "$member" in
        "$allowed"|"$allowed"/*) ;;
        *)
          echo "archive member outside $allowed: $member" >&2
          exit 1
          ;;
      esac
    done

    tar -tvzf "$archive" | awk '$1 ~ /^[hlbcps]/ { print "unsafe archive member type: " $0 > "/dev/stderr"; bad = 1 } END { exit bad ? 1 : 0 }'
  register: terrarium_cockpit_s3_bundle_paths
  changed_when: false
  ignore_errors: true
  args:
    executable: /bin/bash
  when:
    - terrarium_cockpit_s3_bundle_download is defined
    - terrarium_cockpit_s3_bundle_download.dest is defined
    - terrarium_cockpit_s3_bundle_file.stat.exists | default(false)

- name: Determine whether prebuilt cockpit-zfs bundle is usable
  ansible.builtin.set_fact:
    terrarium_cockpit_zfs_bundle_usable: >-
      {{
        terrarium_cockpit_zfs_bundle_download is defined
        and terrarium_cockpit_zfs_bundle_download is succeeded
        and terrarium_cockpit_zfs_bundle_download.dest is defined
        and terrarium_cockpit_zfs_bundle_file.stat.exists | default(false)
        and (terrarium_cockpit_zfs_bundle_file.stat.size | default(0) | int) > 0
        and terrarium_cockpit_zfs_bundle_paths is defined
        and terrarium_cockpit_zfs_bundle_paths is succeeded
      }}

- name: Determine whether prebuilt cockpit-s3 bundle is usable
  ansible.builtin.set_fact:
    terrarium_cockpit_s3_bundle_usable: >-
      {{
        terrarium_cockpit_s3_bundle_download is defined
        and terrarium_cockpit_s3_bundle_download is succeeded
        and terrarium_cockpit_s3_bundle_download.dest is defined
        and terrarium_cockpit_s3_bundle_file.stat.exists | default(false)
        and (terrarium_cockpit_s3_bundle_file.stat.size | default(0) | int) > 0
        and terrarium_cockpit_s3_bundle_paths is defined
        and terrarium_cockpit_s3_bundle_paths is succeeded
      }}

- name: Install prebuilt cockpit-zfs bundle
  ansible.builtin.shell: |
    set -euo pipefail
    archive="{{ terrarium_cockpit_zfs_bundle_download.dest }}"
    stage="{{ terrarium_cockpit_plugin_stage_dir }}/zfs"
    rm -rf "$stage"
    mkdir -p "$stage" /usr/share/cockpit/zfs
    tar -xzf "$archive" -C "$stage" --no-same-owner --no-same-permissions
    rsync -a --delete --chown=root:root "$stage/usr/share/cockpit/zfs/" /usr/share/cockpit/zfs/
  args:
    executable: /bin/bash
  when:
    - terrarium_cockpit_zfs_bundle_usable | default(false)
    - terrarium_cockpit_zfs_bundle_download.changed or not terrarium_cockpit_zfs_installed.stat.exists

- name: Install prebuilt cockpit-s3 bundle
  ansible.builtin.shell: |
    set -euo pipefail
    archive="{{ terrarium_cockpit_s3_bundle_download.dest }}"
    stage="{{ terrarium_cockpit_plugin_stage_dir }}/s3"
    rm -rf "$stage"
    mkdir -p "$stage" /usr/share/cockpit/cockpit-s3-browser
    tar -xzf "$archive" -C "$stage" --no-same-owner --no-same-permissions
    rsync -a --delete --chown=root:root "$stage/usr/share/cockpit/cockpit-s3-browser/" /usr/share/cockpit/cockpit-s3-browser/
  args:
    executable: /bin/bash
  when:
    - terrarium_cockpit_s3_bundle_usable | default(false)
    - terrarium_cockpit_s3_bundle_download.changed or not terrarium_cockpit_s3_installed.stat.exists

- name: Install cockpit plugin build dependencies
  ansible.builtin.apt:
    name: "{{ terrarium_cockpit_plugin_build_deps }}"
    state: present
  when: not (terrarium_cockpit_zfs_bundle_usable | default(false)) or not (terrarium_cockpit_s3_bundle_usable | default(false))

- name: Enable corepack for yarn-managed builds
  ansible.builtin.shell: |
    set -euo pipefail
    npm install -g corepack
    corepack enable
  args:
    executable: /bin/bash
  changed_when: false
  when: not (terrarium_cockpit_zfs_bundle_usable | default(false)) or not (terrarium_cockpit_s3_bundle_usable | default(false))

- name: Ensure plugin source directory exists
  ansible.builtin.file:
    path: /usr/local/src
    state: directory
    mode: "0755"
  when: not (terrarium_cockpit_zfs_bundle_usable | default(false)) or not (terrarium_cockpit_s3_bundle_usable | default(false))

- name: Checkout cockpit-zfs source
  ansible.builtin.git:
    repo: "{{ terrarium_cockpit_zfs_repo }}"
    dest: /usr/local/src/cockpit-zfs
    version: "{{ terrarium_cockpit_zfs_ref }}"
    force: true
  register: terrarium_cockpit_zfs_checkout
  when: not (terrarium_cockpit_zfs_bundle_usable | default(false))

- name: Verify cockpit-zfs source commit
  ansible.builtin.command: git rev-parse HEAD
  args:
    chdir: /usr/local/src/cockpit-zfs
  register: terrarium_cockpit_zfs_source_commit
  changed_when: false
  failed_when: terrarium_cockpit_zfs_source_commit.stdout | trim != terrarium_cockpit_zfs_commit
  when: not (terrarium_cockpit_zfs_bundle_usable | default(false))

- name: Pin cockpit-zfs source bootstrap to the declared Yarn release
  ansible.builtin.shell: |
    set -euo pipefail
    yarn_version="$(jq -r '(.packageManager // "yarn@4.6.0") | sub("^yarn@"; "")' package.json)"
    sed -i "s/yarn set version stable/yarn set version ${yarn_version}/" bootstrap.sh
  args:
    chdir: /usr/local/src/cockpit-zfs
    executable: /bin/bash
  changed_when: false
  when: not (terrarium_cockpit_zfs_bundle_usable | default(false))

- name: Build and install cockpit-zfs
  ansible.builtin.shell: |
    set -euo pipefail
    corepack enable
    make install RESTART_COCKPIT=0
  args:
    chdir: /usr/local/src/cockpit-zfs
    executable: /bin/bash
  when:
    - not (terrarium_cockpit_zfs_bundle_usable | default(false))
    - terrarium_cockpit_zfs_checkout.changed or not terrarium_cockpit_zfs_installed.stat.exists

- name: Checkout cockpit-S3ObjectBroswer source
  ansible.builtin.git:
    repo: "{{ terrarium_cockpit_s3_repo }}"
    dest: /usr/local/src/cockpit-S3ObjectBroswer
    version: "{{ terrarium_cockpit_s3_ref }}"
    force: true
  register: terrarium_cockpit_s3_checkout
  when: not (terrarium_cockpit_s3_bundle_usable | default(false))

- name: Verify cockpit-S3ObjectBroswer source commit
  ansible.builtin.command: git rev-parse HEAD
  args:
    chdir: /usr/local/src/cockpit-S3ObjectBroswer
  register: terrarium_cockpit_s3_source_commit
  changed_when: false
  failed_when: terrarium_cockpit_s3_source_commit.stdout | trim != terrarium_cockpit_s3_commit
  when: not (terrarium_cockpit_s3_bundle_usable | default(false))

- name: Pin cockpit-S3ObjectBroswer source bootstrap to the declared Yarn release
  ansible.builtin.shell: |
    set -euo pipefail
    yarn_version="$(jq -r '(.packageManager // "yarn@4.12.0") | sub("^yarn@"; "")' package.json)"
    sed -i "s/yarn set version stable/yarn set version ${yarn_version}/" bootstrap.sh
  args:
    chdir: /usr/local/src/cockpit-S3ObjectBroswer
    executable: /bin/bash
  changed_when: false
  when: not (terrarium_cockpit_s3_bundle_usable | default(false))

- name: Build and install cockpit-S3ObjectBroswer
  ansible.builtin.shell: |
    set -euo pipefail
    corepack enable
    make install RESTART_COCKPIT=0
  args:
    chdir: /usr/local/src/cockpit-S3ObjectBroswer
    executable: /bin/bash
  when:
    - not (terrarium_cockpit_s3_bundle_usable | default(false))
    - terrarium_cockpit_s3_checkout.changed or not terrarium_cockpit_s3_installed.stat.exists

- name: Restart cockpit socket after plugin install
  ansible.builtin.systemd:
    name: cockpit.socket
    state: restarted
