- name: Check whether snapd snap is installed
  ansible.builtin.command: snap list snapd
  register: terrarium_snapd_snap_list
  failed_when: false
  changed_when: false

- name: Wait for active snap changes to settle before snapd prerequisite
  ansible.builtin.shell: |
    set -u

    active_changes="$(snap changes --no-legend 2>/dev/null | awk '$2 ~ /^(Doing|Undoing)$/ { print $1 }')"
    if [ -z "$active_changes" ]; then
      exit 0
    fi

    for change_id in $active_changes; do
      echo "Waiting for snap change ${change_id} to settle"
      /usr/bin/timeout 120s snap watch "$change_id"
      rc=$?
      if [ "$rc" -ne 0 ]; then
        echo "snap change ${change_id} did not settle:" >&2
        snap change "$change_id" >&2 || true
        exit "$rc"
      fi
    done
  args:
    executable: /bin/bash
  register: terrarium_snapd_snap_changes_before_prerequisite
  until: terrarium_snapd_snap_changes_before_prerequisite.rc == 0
  retries: 6
  delay: 10
  changed_when: false

- name: Refresh snapd snap when installed
  ansible.builtin.command: /usr/bin/timeout --kill-after=15s 180s snap refresh snapd
  register: terrarium_snapd_snap_refresh
  until:
    - terrarium_snapd_snap_refresh.rc == 0
      or 'has no updates available' in (terrarium_snapd_snap_refresh.stdout | lower)
      or 'has no updates available' in (terrarium_snapd_snap_refresh.stderr | lower)
  retries: 10
  delay: 10
  changed_when:
    - terrarium_snapd_snap_refresh.rc == 0
    - "'has no updates available' not in (terrarium_snapd_snap_refresh.stdout | lower)"
    - "'has no updates available' not in (terrarium_snapd_snap_refresh.stderr | lower)"
  when: terrarium_snapd_snap_list.rc == 0

- name: Install snapd snap when missing
  ansible.builtin.command: /usr/bin/timeout --kill-after=15s 180s snap install snapd
  register: terrarium_snapd_snap_install
  until:
    - terrarium_snapd_snap_install.rc == 0
      or 'already installed' in (terrarium_snapd_snap_install.stdout | lower)
      or 'already installed' in (terrarium_snapd_snap_install.stderr | lower)
  retries: 10
  delay: 10
  changed_when:
    - terrarium_snapd_snap_install.rc == 0
    - "'already installed' not in (terrarium_snapd_snap_install.stdout | lower)"
    - "'already installed' not in (terrarium_snapd_snap_install.stderr | lower)"
  when: terrarium_snapd_snap_list.rc != 0

- name: Wait for active snap changes to settle after snapd prerequisite
  ansible.builtin.shell: |
    set -u

    active_changes="$(snap changes --no-legend 2>/dev/null | awk '$2 ~ /^(Doing|Undoing)$/ { print $1 }')"
    if [ -z "$active_changes" ]; then
      exit 0
    fi

    for change_id in $active_changes; do
      echo "Waiting for snap change ${change_id} to settle"
      /usr/bin/timeout 120s snap watch "$change_id"
      rc=$?
      if [ "$rc" -ne 0 ]; then
        echo "snap change ${change_id} did not settle:" >&2
        snap change "$change_id" >&2 || true
        exit "$rc"
      fi
    done
  args:
    executable: /bin/bash
  register: terrarium_snapd_snap_changes_after_prerequisite
  until: terrarium_snapd_snap_changes_after_prerequisite.rc == 0
  retries: 6
  delay: 10
  changed_when: false

- name: Check whether LXD snap is already installed
  ansible.builtin.command: snap list lxd
  register: terrarium_lxd_snap_list
  failed_when: false
  changed_when: false

- name: Install LXD snap when missing
  ansible.builtin.shell: |
    set -u

    install_output="$({ /usr/bin/timeout --kill-after=15s 180s snap install lxd --channel={{ terrarium_lxd_snap_channel }}; } 2>&1)"
    install_rc=$?
    printf '%s\n' "$install_output"

    if printf '%s\n' "$install_output" | grep -Eiq 'already installed'; then
      exit 0
    fi

    if [ "$install_rc" -eq 0 ]; then
      echo "terrarium_lxd_snap_install_changed=1"
      exit 0
    fi

    if ! printf '%s\n' "$install_output" | grep -Eiq 'change in progress|install-snap'; then
      exit "$install_rc"
    fi

    active_changes="$(snap changes --no-legend 2>/dev/null | awk '$2 ~ /^(Doing|Undoing)$/ { print $1 }')"
    if [ -n "$active_changes" ]; then
      for change_id in $active_changes; do
        echo "Waiting for snap change ${change_id} to settle"
        /usr/bin/timeout 120s snap watch "$change_id"
        watch_rc=$?
        if [ "$watch_rc" -ne 0 ]; then
          echo "snap change ${change_id} did not settle:" >&2
          snap change "$change_id" >&2 || true
          exit "$watch_rc"
        fi
      done
    fi

    if snap list lxd >/dev/null 2>&1; then
      exit 0
    fi

    echo "snap install lxd reported a change in progress, but LXD is still not installed after waiting" >&2
    exit "$install_rc"
  args:
    executable: /bin/bash
  register: terrarium_lxd_snap_install
  until: terrarium_lxd_snap_install.rc == 0
  retries: 10
  delay: 10
  changed_when:
    - terrarium_lxd_snap_install.rc == 0
    - "'terrarium_lxd_snap_install_changed=1' in terrarium_lxd_snap_install.stdout"
  when: terrarium_lxd_snap_list.rc != 0

- name: Wait for active snap changes to settle after LXD install
  ansible.builtin.shell: |
    set -u

    active_changes="$(snap changes --no-legend 2>/dev/null | awk '$2 ~ /^(Doing|Undoing)$/ { print $1 }')"
    if [ -z "$active_changes" ]; then
      exit 0
    fi

    for change_id in $active_changes; do
      echo "Waiting for snap change ${change_id} to settle"
      /usr/bin/timeout 120s snap watch "$change_id"
      rc=$?
      if [ "$rc" -ne 0 ]; then
        echo "snap change ${change_id} did not settle:" >&2
        snap change "$change_id" >&2 || true
        exit "$rc"
      fi
    done
  args:
    executable: /bin/bash
  register: terrarium_lxd_snap_changes_after_install
  until: terrarium_lxd_snap_changes_after_install.rc == 0
  retries: 6
  delay: 10
  changed_when: false

- name: Require LXD snap readiness after install
  ansible.builtin.shell: |
    set -u

    installing_message="Installing LXD snap, please be patient."
    attempts=30
    delay_seconds=10
    last_waitready_output=""
    last_waitready_rc=0
    last_info_output=""
    last_info_rc=0

    for attempt in $(seq 1 "$attempts"); do
      last_waitready_output="$({ /usr/bin/timeout --kill-after=5s 30s /snap/bin/lxd waitready; } 2>&1)"
      last_waitready_rc=$?

      last_info_output="$({ /usr/bin/timeout --kill-after=5s 30s /snap/bin/lxc info; } 2>&1)"
      last_info_rc=$?

      combined_output="$(printf '%s\n%s\n' "$last_waitready_output" "$last_info_output")"
      if [ "$last_waitready_rc" -eq 0 ] && [ "$last_info_rc" -eq 0 ] && ! printf '%s\n' "$combined_output" | grep -Fq "$installing_message"; then
        exit 0
      fi

      if [ "$attempt" -lt "$attempts" ]; then
        sleep "$delay_seconds"
      fi
    done

    echo "LXD did not become ready after snap installation." >&2
    echo "Last /snap/bin/lxd waitready rc=${last_waitready_rc}:" >&2
    printf '%s\n' "$last_waitready_output" >&2
    echo "Last /snap/bin/lxc info rc=${last_info_rc}:" >&2
    printf '%s\n' "$last_info_output" >&2
    echo "snap changes:" >&2
    snap changes >&2 || true
    echo "snap services lxd:" >&2
    snap services lxd >&2 || true
    exit 1
  args:
    executable: /bin/bash
  changed_when: false

- name: Enable LXD UI
  ansible.builtin.command: snap set lxd ui.enable=true
  register: terrarium_lxd_ui_enable
  until: terrarium_lxd_ui_enable.rc == 0
  retries: 12
  delay: 10
  changed_when: false

- name: Wait for active snap changes to settle after LXD UI configuration
  ansible.builtin.shell: |
    set -u

    active_changes="$(snap changes --no-legend 2>/dev/null | awk '$2 ~ /^(Doing|Undoing)$/ { print $1 }')"
    if [ -z "$active_changes" ]; then
      exit 0
    fi

    for change_id in $active_changes; do
      echo "Waiting for snap change ${change_id} to settle"
      /usr/bin/timeout 120s snap watch "$change_id"
      rc=$?
      if [ "$rc" -ne 0 ]; then
        echo "snap change ${change_id} did not settle:" >&2
        snap change "$change_id" >&2 || true
        exit "$rc"
      fi
    done
  args:
    executable: /bin/bash
  register: terrarium_lxd_snap_changes_after_ui
  until: terrarium_lxd_snap_changes_after_ui.rc == 0
  retries: 6
  delay: 10
  changed_when: false

- name: Wait for LXD daemon to be ready after UI configuration
  ansible.builtin.command: /usr/bin/timeout 120s /snap/bin/lxd waitready
  register: terrarium_lxd_waitready_after_ui
  until: terrarium_lxd_waitready_after_ui.rc == 0
  retries: 5
  delay: 10
  changed_when: false

- name: Verify LXD client can reach daemon after UI configuration
  ansible.builtin.command: /snap/bin/lxc info
  register: terrarium_lxd_info_after_ui
  until: terrarium_lxd_info_after_ui.rc == 0
  retries: 12
  delay: 10
  changed_when: false

- name: Check whether LXD storage pool exists
  ansible.builtin.command: /snap/bin/lxc storage show {{ terrarium_lxd_pool_name }}
  register: terrarium_lxd_storage_pool
  failed_when: false
  changed_when: false

- name: Render LXD preseed
  ansible.builtin.template:
    src: lxd-preseed.yml.j2
    dest: "{{ terrarium_state_dir }}/lxd-preseed.yml"
    mode: "0600"

- name: Initialize LXD with ZFS pool
  ansible.builtin.shell: "/snap/bin/lxd init --preseed < {{ terrarium_state_dir }}/lxd-preseed.yml"
  args:
    executable: /bin/bash
  when: terrarium_lxd_storage_pool.rc != 0

- name: Wait for LXD daemon to be ready after preseed
  ansible.builtin.command: /usr/bin/timeout 120s /snap/bin/lxd waitready
  register: terrarium_lxd_waitready_after_preseed
  until: terrarium_lxd_waitready_after_preseed.rc == 0
  retries: 5
  delay: 10
  changed_when: false

- name: Verify LXD client can reach daemon after preseed
  ansible.builtin.command: /snap/bin/lxc info
  register: terrarium_lxd_info_after_preseed
  until: terrarium_lxd_info_after_preseed.rc == 0
  retries: 12
  delay: 10
  changed_when: false

- name: Install OVN networking packages
  ansible.builtin.apt:
    name:
      - openvswitch-switch
      - ovn-central
      - ovn-host
    state: present

- name: Resolve OVN TLS paths
  ansible.builtin.set_fact:
    terrarium_ovn_tls_dir: /etc/terrarium/secrets/ovn
    terrarium_ovn_ca_cert_path: /etc/terrarium/secrets/ovn/ca.crt
    terrarium_ovn_ca_key_path: /etc/terrarium/secrets/ovn/ca.key
    terrarium_ovn_node_key_path: /etc/terrarium/secrets/ovn/node.key
    terrarium_ovn_node_csr_path: /etc/terrarium/secrets/ovn/node.csr
    terrarium_ovn_node_cert_path: /etc/terrarium/secrets/ovn/node.crt
    terrarium_ovn_node_openssl_config_path: /etc/terrarium/secrets/ovn/node-openssl.cnf

- name: Resolve OVN database connection strings
  ansible.builtin.set_fact:
    terrarium_ovn_northbound_connection: >-
      {%- set endpoints = [] -%}
      {%- for address in terrarium_ovn_central_addresses -%}
      {%- set host = '[' ~ address ~ ']' if ':' in address else address -%}
      {%- set _ = endpoints.append('ssl:' ~ host ~ ':6641') -%}
      {%- endfor -%}
      {{ endpoints | join(',') }}
    terrarium_ovn_southbound_connection: >-
      {%- set endpoints = [] -%}
      {%- for address in terrarium_ovn_central_addresses -%}
      {%- set host = '[' ~ address ~ ']' if ':' in address else address -%}
      {%- set _ = endpoints.append('ssl:' ~ host ~ ':6642') -%}
      {%- endfor -%}
      {{ endpoints | join(',') }}

- name: Assert OVN CA material exists for cluster mode
  ansible.builtin.assert:
    that:
      - terrarium_ovn_ca_cert | length > 0
      - terrarium_ovn_ca_key | length > 0
    fail_msg: Terrarium cluster mode requires OVN CA material. Run terrariumctl cluster init or terrariumctl cluster ovn configure to generate it.
  when: terrarium_ovn_central_addresses | length > 0
  no_log: true

- name: Create OVN TLS directory
  ansible.builtin.file:
    path: "{{ terrarium_ovn_tls_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: terrarium_ovn_central_addresses | length > 0

- name: Install OVN CA certificate
  ansible.builtin.copy:
    content: "{{ terrarium_ovn_ca_cert }}"
    dest: "{{ terrarium_ovn_ca_cert_path }}"
    owner: root
    group: root
    mode: "0644"
  when: terrarium_ovn_central_addresses | length > 0
  no_log: true

- name: Install OVN CA private key
  ansible.builtin.copy:
    content: "{{ terrarium_ovn_ca_key }}"
    dest: "{{ terrarium_ovn_ca_key_path }}"
    owner: root
    group: root
    mode: "0600"
  when: terrarium_ovn_central_addresses | length > 0
  no_log: true

- name: Render OVN node certificate request config
  ansible.builtin.template:
    src: ovn-node-openssl.cnf.j2
    dest: "{{ terrarium_ovn_node_openssl_config_path }}"
    owner: root
    group: root
    mode: "0600"
  when: terrarium_ovn_central_addresses | length > 0
  register: terrarium_ovn_node_openssl_config

- name: Check whether OVN node certificate exists
  ansible.builtin.stat:
    path: "{{ terrarium_ovn_node_cert_path }}"
  when: terrarium_ovn_central_addresses | length > 0
  register: terrarium_ovn_node_cert_stat

- name: Generate OVN node private key
  ansible.builtin.command:
    argv:
      - openssl
      - genrsa
      - -out
      - "{{ terrarium_ovn_node_key_path }}"
      - "4096"
    creates: "{{ terrarium_ovn_node_key_path }}"
  when: terrarium_ovn_central_addresses | length > 0
  register: terrarium_ovn_node_key
  no_log: true

- name: Lock down OVN node private key
  ansible.builtin.file:
    path: "{{ terrarium_ovn_node_key_path }}"
    owner: root
    group: root
    mode: "0600"
  when: terrarium_ovn_central_addresses | length > 0

- name: Generate OVN node certificate request
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -new
      - -key
      - "{{ terrarium_ovn_node_key_path }}"
      - -out
      - "{{ terrarium_ovn_node_csr_path }}"
      - -config
      - "{{ terrarium_ovn_node_openssl_config_path }}"
  when:
    - terrarium_ovn_central_addresses | length > 0
    - terrarium_ovn_node_openssl_config.changed or terrarium_ovn_node_key.changed or not terrarium_ovn_node_cert_stat.stat.exists
  register: terrarium_ovn_node_csr
  no_log: true

- name: Sign OVN node certificate
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -req
      - -in
      - "{{ terrarium_ovn_node_csr_path }}"
      - -CA
      - "{{ terrarium_ovn_ca_cert_path }}"
      - -CAkey
      - "{{ terrarium_ovn_ca_key_path }}"
      - -CAcreateserial
      - -out
      - "{{ terrarium_ovn_node_cert_path }}"
      - -days
      - "3650"
      - -sha256
      - -extensions
      - v3_req
      - -extfile
      - "{{ terrarium_ovn_node_openssl_config_path }}"
  when:
    - terrarium_ovn_central_addresses | length > 0
    - terrarium_ovn_node_csr.changed or not terrarium_ovn_node_cert_stat.stat.exists
  register: terrarium_ovn_node_cert
  no_log: true

- name: Lock down OVN node certificate
  ansible.builtin.file:
    path: "{{ terrarium_ovn_node_cert_path }}"
    owner: root
    group: root
    mode: "0644"
  when: terrarium_ovn_central_addresses | length > 0

- name: Configure clustered OVN central service
  ansible.builtin.template:
    src: ovn-central.j2
    dest: /etc/default/ovn-central
    mode: "0644"
  when:
    - terrarium_ovn_central_addresses | length > 0
    - terrarium_ovn_local_address in terrarium_ovn_central_addresses
  register: terrarium_ovn_central_config

- name: Enable OVN central on standalone or central members
  ansible.builtin.systemd:
    name: ovn-central
    state: "{{ 'restarted' if (terrarium_ovn_central_config.changed | default(false)) or (terrarium_ovn_node_cert.changed | default(false)) else 'started' }}"
    enabled: true
  when: terrarium_ovn_central_addresses | length == 0 or terrarium_ovn_local_address in terrarium_ovn_central_addresses

- name: Disable OVN central on non-central cluster members
  ansible.builtin.systemd:
    name: ovn-central
    state: stopped
    enabled: false
  when:
    - terrarium_ovn_central_addresses | length > 0
    - terrarium_ovn_local_address not in terrarium_ovn_central_addresses

- name: Configure OVN northbound SSL listener
  ansible.builtin.command:
    argv:
      - ovn-nbctl
      - --db=unix:/var/run/ovn/ovnnb_db.sock
      - set-ssl
      - "{{ terrarium_ovn_node_key_path }}"
      - "{{ terrarium_ovn_node_cert_path }}"
      - "{{ terrarium_ovn_ca_cert_path }}"
      - --
      - set-connection
      - pssl:6641
  register: terrarium_ovn_nb_ssl_listener
  until: terrarium_ovn_nb_ssl_listener.rc == 0
  retries: 12
  delay: 5
  changed_when: false
  when:
    - terrarium_ovn_central_addresses | length > 0
    - terrarium_ovn_local_address in terrarium_ovn_central_addresses

- name: Configure OVN southbound SSL listener
  ansible.builtin.command:
    argv:
      - ovn-sbctl
      - --db=unix:/var/run/ovn/ovnsb_db.sock
      - set-ssl
      - "{{ terrarium_ovn_node_key_path }}"
      - "{{ terrarium_ovn_node_cert_path }}"
      - "{{ terrarium_ovn_ca_cert_path }}"
      - --
      - set-connection
      - pssl:6642
  register: terrarium_ovn_sb_ssl_listener
  until: terrarium_ovn_sb_ssl_listener.rc == 0
  retries: 12
  delay: 5
  changed_when: false
  when:
    - terrarium_ovn_central_addresses | length > 0
    - terrarium_ovn_local_address in terrarium_ovn_central_addresses

- name: Enable OVN host service
  ansible.builtin.systemd:
    name: ovn-host
    state: started
    enabled: true

- name: Configure Open vSwitch SSL identity for OVN
  ansible.builtin.command:
    argv:
      - ovs-vsctl
      - set-ssl
      - "{{ terrarium_ovn_node_key_path }}"
      - "{{ terrarium_ovn_node_cert_path }}"
      - "{{ terrarium_ovn_ca_cert_path }}"
  register: terrarium_ovs_ssl
  until: terrarium_ovs_ssl.rc == 0
  retries: 12
  delay: 5
  changed_when: false
  when: terrarium_ovn_central_addresses | length > 0

- name: Configure Open vSwitch for Terrarium OVN
  ansible.builtin.command:
    argv:
      - ovs-vsctl
      - set
      - open_vswitch
      - "."
      - "external_ids:ovn-remote={{ (terrarium_ovn_central_addresses | length > 0) | ternary(terrarium_ovn_southbound_connection, 'unix:/var/run/ovn/ovnsb_db.sock') }}"
      - "external_ids:ovn-encap-type=geneve"
      - "external_ids:ovn-encap-ip={{ (terrarium_ovn_central_addresses | length > 0) | ternary(terrarium_ovn_local_address, '127.0.0.1') }}"
  register: terrarium_ovs_configure
  until: terrarium_ovs_configure.rc == 0
  retries: 12
  delay: 5
  changed_when: false

- name: Restart OVN host after TLS identity rotation
  ansible.builtin.systemd:
    name: ovn-host
    state: restarted
  when:
    - terrarium_ovn_central_addresses | length > 0
    - terrarium_ovn_node_cert.changed | default(false)

- name: Read OVN node certificate for LXD
  ansible.builtin.slurp:
    src: "{{ terrarium_ovn_node_cert_path }}"
  when: terrarium_ovn_central_addresses | length > 0
  register: terrarium_ovn_node_cert_raw
  no_log: true

- name: Read OVN node private key for LXD
  ansible.builtin.slurp:
    src: "{{ terrarium_ovn_node_key_path }}"
  when: terrarium_ovn_central_addresses | length > 0
  register: terrarium_ovn_node_key_raw
  no_log: true

- name: Configure LXD OVN TLS client settings
  block:
    - name: Write temporary LXD OVN TLS patch
      ansible.builtin.copy:
        dest: /run/terrarium-lxd-ovn-tls.json
        mode: "0600"
        content: "{{ {'config': {'network.ovn.northbound_connection': terrarium_ovn_northbound_connection, 'network.ovn.ca_cert': terrarium_ovn_ca_cert, 'network.ovn.client_cert': (terrarium_ovn_node_cert_raw.content | b64decode), 'network.ovn.client_key': (terrarium_ovn_node_key_raw.content | b64decode)}} | to_json }}"

    - name: Apply LXD OVN TLS patch
      ansible.builtin.command:
        argv:
          - curl
          - -fsS
          - --unix-socket
          - /var/snap/lxd/common/lxd/unix.socket
          - -X
          - PATCH
          - -H
          - "Content-Type: application/json"
          - --data-binary
          - "@/run/terrarium-lxd-ovn-tls.json"
          - http://unix.socket/1.0
      changed_when: false
  always:
    - name: Remove temporary LXD OVN TLS patch
      ansible.builtin.file:
        path: /run/terrarium-lxd-ovn-tls.json
        state: absent
  when: terrarium_ovn_central_addresses | length > 0
  no_log: true

- name: Configure LXD OVN parent network ranges
  ansible.builtin.command: >-
    /snap/bin/lxc network set {{ terrarium_lxd_network_parent }}
    ipv4.dhcp.ranges={{ terrarium_lxd_parent_dhcp_range }}
    ipv4.ovn.ranges={{ terrarium_lxd_parent_ovn_range }}
  changed_when: false

- name: Check whether Terrarium OVN workload network exists
  ansible.builtin.command: "/snap/bin/lxc network show {{ terrarium_lxd_network_name }}"
  register: terrarium_lxd_ovn_network
  failed_when: false
  changed_when: false

- name: Create Terrarium OVN workload network
  ansible.builtin.command: "/snap/bin/lxc network create {{ terrarium_lxd_network_name }} --type=ovn network={{ terrarium_lxd_network_parent }}"
  register: terrarium_lxd_ovn_network_create
  until: terrarium_lxd_ovn_network_create.rc == 0
  retries: 12
  delay: 5
  when: terrarium_lxd_ovn_network.rc != 0

- name: Pin LXD API to loopback
  ansible.builtin.command: /snap/bin/lxc config set core.https_address 127.0.0.1:8443
  changed_when: false
  when: not (terrarium_cluster_enabled | bool)

- name: Pin clustered LXD API to the WireGuard tunnel address
  ansible.builtin.command: "/snap/bin/lxc config set core.https_address {{ terrarium_ovn_local_address }}:8443"
  changed_when: false
  when:
    - terrarium_cluster_enabled | bool
    - terrarium_cluster_wireguard_enabled | default(false) | bool

- name: Allow LXD bridge DHCP and DNS through UFW
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ terrarium_lxd_network_parent }}"
    proto: "{{ item.proto }}"
    port: "{{ item.port }}"
  loop:
    - { port: "67", proto: "udp" }
    - { port: "53", proto: "udp" }
    - { port: "53", proto: "tcp" }

- name: Allow routed LXD bridge egress through UFW
  community.general.ufw:
    rule: allow
    route: true
    interface_in: "{{ terrarium_lxd_network_parent }}"
    interface_out: "{{ ansible_default_ipv4.interface }}"

- name: Disable LXD ACME certificate management
  ansible.builtin.command: "/snap/bin/lxc config unset {{ item }}"
  loop:
    - acme.email
    - acme.domain
  failed_when: false
  changed_when: false

- name: Resolve LXD OIDC issuer
  ansible.builtin.set_fact:
    terrarium_lxd_oidc_issuer_effective: "{{ terrarium_oidc_issuer | regex_replace('^([A-Za-z][A-Za-z0-9+.-]*://[^/]+)/$', '\\1') }}"
  when: terrarium_oidc_issuer | length > 0

- name: Configure OIDC issuer when provided
  ansible.builtin.command: "/snap/bin/lxc config set oidc.issuer {{ terrarium_lxd_oidc_issuer_effective }}"
  register: terrarium_lxd_oidc_issuer_config
  until: terrarium_lxd_oidc_issuer_config.rc == 0
  retries: 12
  delay: 10
  when:
    - terrarium_idp_mode == 'oidc'
    - terrarium_lxd_oidc_issuer_effective | default('', true) | length > 0
  changed_when: false

- name: Configure LXD OIDC groups claim when provided
  ansible.builtin.command: "/snap/bin/lxc config set oidc.groups.claim {{ terrarium_lxd_oidc_groups_claim_effective }}"
  when:
    - terrarium_idp_mode == 'oidc'
    - terrarium_lxd_oidc_issuer_effective | default('', true) | length > 0
    - terrarium_lxd_oidc_groups_claim_effective | length > 0
  changed_when: false

- name: Configure LXD OIDC scopes when provided
  ansible.builtin.command:
    argv:
      - /snap/bin/lxc
      - config
      - set
      - oidc.scopes
      - "{{ terrarium_lxd_oidc_scopes_effective }}"
  when:
    - terrarium_idp_mode == 'oidc'
    - terrarium_lxd_oidc_issuer_effective | default('', true) | length > 0
    - terrarium_lxd_oidc_scopes_effective | length > 0
  changed_when: false

- name: Resolve local IdP output path for LXD
  ansible.builtin.set_fact:
    terrarium_lxd_local_idp_outputs_path_effective: >-
      {{
        (terrarium_local_idp_outputs_path_effective | default('', true) | string | trim)
        if (terrarium_local_idp_outputs_path_effective | default('', true) | string | trim | length > 0)
        else (
          (terrarium_local_idp_outputs_path | default('', true) | string | trim)
          if (terrarium_local_idp_outputs_path | default('', true) | string | trim | length > 0)
          else (
            (terrarium_local_idp_outputs_path_default | default('/etc/terrarium/idp-apps.json', true))
            if (terrarium_idp_provider_effective | default(terrarium_idp_provider | default('', true), true) | string | trim | lower) == 'logto'
            else (
              (terrarium_zitadel_outputs_path_effective | default('', true) | string | trim)
              if (terrarium_zitadel_outputs_path_effective | default('', true) | string | trim | length > 0)
              else (
                (terrarium_zitadel_outputs_path | default('', true) | string | trim)
                if (terrarium_zitadel_outputs_path | default('', true) | string | trim | length > 0)
                else '/etc/terrarium/zitadel-apps.json'
              )
            )
          )
        )
      }}
  when: terrarium_idp_mode == 'local'

- name: Read local IdP outputs for LXD local client configuration
  ansible.builtin.slurp:
    src: "{{ terrarium_lxd_local_idp_outputs_path_effective }}"
  register: terrarium_lxd_local_idp_outputs_raw
  failed_when: false
  changed_when: false
  when:
    - terrarium_idp_mode == 'local'
    - terrarium_lxd_local_idp_outputs_path_effective | default('', true) | length > 0

- name: Parse local IdP outputs for LXD local client configuration
  ansible.builtin.set_fact:
    terrarium_lxd_local_idp_outputs: "{{ terrarium_lxd_local_idp_outputs_raw.content | b64decode | from_json }}"
  when:
    - terrarium_idp_mode == 'local'
    - terrarium_lxd_local_idp_outputs_raw is defined
    - terrarium_lxd_local_idp_outputs_raw.content is defined

- name: Resolve LXD OIDC client ID
  ansible.builtin.set_fact:
    terrarium_lxd_oidc_client_id_effective: >-
      {{
        (
          (terrarium_lxd_local_idp_outputs | default({})).get('lxd_client_id', {}).get('value', '')
          if terrarium_idp_mode == 'local'
          else ((terrarium_lxd_oidc_client_id | default('', true)) or terrarium_oidc_client_id)
        ) | default('', true)
      }}

- name: Resolve LXD OIDC client secret
  ansible.builtin.set_fact:
    terrarium_lxd_oidc_client_secret_effective: >-
      {{
        (
          (
            terrarium_lxd_oidc_client_secret | default('', true)
          ) or (
            terrarium_oidc_client_secret
            if (terrarium_lxd_oidc_client_id | default('', true) | length == 0)
            else ''
          )
        )
        if terrarium_idp_mode == 'oidc'
        else ''
      }}
  no_log: true

- name: Configure OIDC client ID when provided
  ansible.builtin.command: "/snap/bin/lxc config set oidc.client.id {{ terrarium_lxd_oidc_client_id_effective }}"
  when:
    - terrarium_idp_mode == 'oidc'
    - terrarium_lxd_oidc_client_id_effective | length > 0
  changed_when: false

- name: Configure OIDC client secret when provided
  block:
    - name: Write temporary LXD OIDC client secret patch
      ansible.builtin.copy:
        dest: /run/terrarium-lxd-oidc-client-secret.json
        mode: "0600"
        content: "{{ {'config': {'oidc.client.secret': terrarium_lxd_oidc_client_secret_effective}} | to_json }}"

    - name: Apply LXD OIDC client secret patch
      ansible.builtin.command:
        argv:
          - curl
          - -fsS
          - --unix-socket
          - /var/snap/lxd/common/lxd/unix.socket
          - -X
          - PATCH
          - -H
          - "Content-Type: application/json"
          - --data-binary
          - "@/run/terrarium-lxd-oidc-client-secret.json"
          - http://unix.socket/1.0
      changed_when: false
  always:
    - name: Remove temporary LXD OIDC client secret patch
      ansible.builtin.file:
        path: /run/terrarium-lxd-oidc-client-secret.json
        state: absent
  when:
    - terrarium_idp_mode == 'oidc'
    - terrarium_lxd_oidc_client_secret_effective | length > 0
  no_log: true

- name: Clear LXD OIDC client secret when not configured
  ansible.builtin.command: /snap/bin/lxc config unset oidc.client.secret
  when: terrarium_idp_mode == 'local' or terrarium_lxd_oidc_client_secret_effective | default('', true) | length == 0
  changed_when: false
  failed_when: false

- name: Check whether LXD management auth group exists
  ansible.builtin.command: /snap/bin/lxc auth group show {{ terrarium_lxd_auth_group }}
  register: terrarium_lxd_auth_group_raw
  failed_when: false
  changed_when: false

- name: Create LXD management auth group
  ansible.builtin.command: /snap/bin/lxc auth group create {{ terrarium_lxd_auth_group }}
  when: terrarium_lxd_auth_group_raw.rc != 0

- name: Ensure LXD management auth group has server admin entitlement
  ansible.builtin.command: /snap/bin/lxc auth group permission add {{ terrarium_lxd_auth_group }} server admin
  register: terrarium_lxd_admin_permission_add
  failed_when:
    - terrarium_lxd_admin_permission_add.rc != 0
    - "'already' not in (terrarium_lxd_admin_permission_add.stderr | lower)"
    - "'already' not in (terrarium_lxd_admin_permission_add.stdout | lower)"
  changed_when: terrarium_lxd_admin_permission_add.rc == 0
  when: terrarium_admin_group | length > 0

- name: Read previous LXD IdP group mapping
  ansible.builtin.slurp:
    src: "{{ terrarium_lxd_idp_group_state_path }}"
  register: terrarium_lxd_previous_idp_group_raw
  failed_when: false
  changed_when: false
  when: terrarium_admin_group | length > 0

- name: Parse previous LXD IdP group mapping
  ansible.builtin.set_fact:
    terrarium_lxd_previous_idp_group: "{{ terrarium_lxd_previous_idp_group_raw.content | default('') | b64decode | trim }}"
  when:
    - terrarium_admin_group | length > 0
    - terrarium_lxd_previous_idp_group_raw is defined

- name: Remove stale LXD IdP group mapping
  ansible.builtin.command: /snap/bin/lxc auth identity-provider-group delete {{ terrarium_lxd_previous_idp_group }}
  failed_when: false
  changed_when: terrarium_lxd_previous_idp_group | length > 0 and terrarium_lxd_previous_idp_group != terrarium_admin_group
  when:
    - terrarium_admin_group | length > 0
    - terrarium_lxd_previous_idp_group is defined
    - terrarium_lxd_previous_idp_group | length > 0
    - terrarium_lxd_previous_idp_group != terrarium_admin_group

- name: Check whether current LXD IdP group mapping exists
  ansible.builtin.command: /snap/bin/lxc auth identity-provider-group show {{ terrarium_admin_group }}
  register: terrarium_lxd_idp_group_raw
  failed_when: false
  changed_when: false
  when: terrarium_admin_group | length > 0

- name: Create current LXD IdP group mapping
  ansible.builtin.command: /snap/bin/lxc auth identity-provider-group create {{ terrarium_admin_group }}
  when:
    - terrarium_admin_group | length > 0
    - terrarium_lxd_idp_group_raw.rc != 0

- name: Map current IdP group to LXD management group
  ansible.builtin.command: /snap/bin/lxc auth identity-provider-group group add {{ terrarium_admin_group }} {{ terrarium_lxd_auth_group }}
  register: terrarium_lxd_idp_group_add
  failed_when:
    - terrarium_lxd_idp_group_add.rc != 0
    - "'already' not in (terrarium_lxd_idp_group_add.stderr | lower)"
    - "'already' not in (terrarium_lxd_idp_group_add.stdout | lower)"
  changed_when: terrarium_lxd_idp_group_add.rc == 0
  when: terrarium_admin_group | length > 0

- name: Persist current LXD IdP group mapping
  ansible.builtin.copy:
    content: "{{ terrarium_admin_group }}\n"
    dest: "{{ terrarium_lxd_idp_group_state_path }}"
    mode: "0600"
  when: terrarium_admin_group | length > 0

- name: Check whether Terrarium-managed LXD profiles exist
  ansible.builtin.command: "/snap/bin/lxc profile show {{ item.name }}"
  loop:
    - { name: "default", template: "default-profile.yml.j2", path: "{{ terrarium_state_dir }}/default-profile.yml" }
    - { name: "terrarium", template: "terrarium-profile.yml.j2", path: "{{ terrarium_state_dir }}/terrarium-profile.yml" }
    - { name: "strict", template: "strict-profile.yml.j2", path: "{{ terrarium_state_dir }}/strict-profile.yml" }
    - { name: "dev", template: "dev-profile.yml.j2", path: "{{ terrarium_state_dir }}/dev-profile.yml" }
    - { name: "vm", template: "vm-profile.yml.j2", path: "{{ terrarium_state_dir }}/vm-profile.yml" }
    - { name: "vm-dev", template: "vm-dev-profile.yml.j2", path: "{{ terrarium_state_dir }}/vm-dev-profile.yml" }
    - { name: "terrarium-ingress", template: "terrarium-ingress-profile.yml.j2", path: "{{ terrarium_state_dir }}/terrarium-ingress-profile.yml" }
  register: terrarium_lxd_profiles
  failed_when: false
  changed_when: false

- name: Render Terrarium-managed LXD profiles
  ansible.builtin.template:
    src: "{{ item.template }}"
    dest: "{{ item.path }}"
    mode: "0600"
  loop:
    - { name: "default", template: "default-profile.yml.j2", path: "{{ terrarium_state_dir }}/default-profile.yml" }
    - { name: "terrarium", template: "terrarium-profile.yml.j2", path: "{{ terrarium_state_dir }}/terrarium-profile.yml" }
    - { name: "strict", template: "strict-profile.yml.j2", path: "{{ terrarium_state_dir }}/strict-profile.yml" }
    - { name: "dev", template: "dev-profile.yml.j2", path: "{{ terrarium_state_dir }}/dev-profile.yml" }
    - { name: "vm", template: "vm-profile.yml.j2", path: "{{ terrarium_state_dir }}/vm-profile.yml" }
    - { name: "vm-dev", template: "vm-dev-profile.yml.j2", path: "{{ terrarium_state_dir }}/vm-dev-profile.yml" }
    - { name: "terrarium-ingress", template: "terrarium-ingress-profile.yml.j2", path: "{{ terrarium_state_dir }}/terrarium-ingress-profile.yml" }

- name: Create missing Terrarium-managed LXD profiles
  ansible.builtin.command: "/snap/bin/lxc profile create {{ item.item.name }}"
  loop: "{{ terrarium_lxd_profiles.results }}"
  when: item.rc != 0

- name: Apply Terrarium-managed LXD profiles
  ansible.builtin.shell: "/snap/bin/lxc profile edit {{ item.name }} < {{ item.path }}"
  args:
    executable: /bin/bash
  loop:
    - { name: "default", template: "default-profile.yml.j2", path: "{{ terrarium_state_dir }}/default-profile.yml" }
    - { name: "terrarium", template: "terrarium-profile.yml.j2", path: "{{ terrarium_state_dir }}/terrarium-profile.yml" }
    - { name: "strict", template: "strict-profile.yml.j2", path: "{{ terrarium_state_dir }}/strict-profile.yml" }
    - { name: "dev", template: "dev-profile.yml.j2", path: "{{ terrarium_state_dir }}/dev-profile.yml" }
    - { name: "vm", template: "vm-profile.yml.j2", path: "{{ terrarium_state_dir }}/vm-profile.yml" }
    - { name: "vm-dev", template: "vm-dev-profile.yml.j2", path: "{{ terrarium_state_dir }}/vm-dev-profile.yml" }
    - { name: "terrarium-ingress", template: "terrarium-ingress-profile.yml.j2", path: "{{ terrarium_state_dir }}/terrarium-ingress-profile.yml" }

- name: Check whether host exposes KVM
  ansible.builtin.stat:
    path: /dev/kvm
  register: terrarium_lxd_kvm_device

- name: Check whether Terrarium KVM profile exists
  ansible.builtin.command: /snap/bin/lxc profile show kvm
  register: terrarium_lxd_kvm_profile
  failed_when: false
  changed_when: false
  when: terrarium_lxd_kvm_device.stat.exists

- name: Render Terrarium KVM profile
  ansible.builtin.template:
    src: kvm-profile.yml.j2
    dest: "{{ terrarium_state_dir }}/kvm-profile.yml"
    mode: "0600"
  when: terrarium_lxd_kvm_device.stat.exists

- name: Create Terrarium KVM profile
  ansible.builtin.command: /snap/bin/lxc profile create kvm
  when:
    - terrarium_lxd_kvm_device.stat.exists
    - terrarium_lxd_kvm_profile.rc | default(1) != 0

- name: Apply Terrarium KVM profile
  ansible.builtin.shell: "/snap/bin/lxc profile edit kvm < {{ terrarium_state_dir }}/kvm-profile.yml"
  args:
    executable: /bin/bash
  when: terrarium_lxd_kvm_device.stat.exists
