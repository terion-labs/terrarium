- name: Provision Terrarium host
  hosts: terrarium
  become: true
  gather_facts: true
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900
  vars:
    terrarium_repo_dir: /opt/terrarium
    terrarium_config_path: /etc/terrarium/config.yaml
    terrarium_state_dir: /var/lib/terrarium
    terrarium_lxd_pool_name: terrarium
    terrarium_cluster_enabled: false
    terrarium_cluster_peer_cidrs: []
    terrarium_cluster_pending_peer_invites: []
    terrarium_cluster_wireguard_enabled: false
    terrarium_cluster_wireguard_interface: terrarium-wg0
    terrarium_cluster_wireguard_cidr: 10.255.54.0/24
    terrarium_cluster_wireguard_port: "51820"
    terrarium_cluster_wireguard_members: []
    terrarium_cluster_wireguard_endpoint_cidrs: []
    terrarium_cluster_pending_wireguard_invites: []
    terrarium_lxd_network_parent: lxdbr0
    terrarium_lxd_network_name: terrarium-ovn
    terrarium_lxd_parent_ipv4: 10.154.0.1/24
    terrarium_lxd_parent_dhcp_range: 10.154.0.2-10.154.0.199
    terrarium_lxd_parent_ovn_range: 10.154.0.200-10.154.0.254
    terrarium_ovn_central_addresses: []
    terrarium_ovn_local_address: "{{ ansible_default_ipv4.address }}"
    terrarium_ovn_ca_cert: ""
    terrarium_ovn_ca_key: ""
    terrarium_storage_mode: file
    terrarium_storage_source: ""
    terrarium_storage_size: ""
    terrarium_storage_partition_start: ""
    terrarium_storage_partition_end: ""
    terrarium_public_ip: "{{ ansible_default_ipv4.address }}"
    terrarium_root_domain: ""
    terrarium_manage_domain: "{{ ('manage.' ~ terrarium_root_domain) if terrarium_root_domain else ('manage.' ~ (terrarium_public_ip | replace('.', '-')) ~ '.traefik.me') }}"
    terrarium_proxy_domain: "{{ ('proxy.' ~ terrarium_root_domain) if terrarium_root_domain else ('proxy.' ~ (terrarium_public_ip | replace('.', '-')) ~ '.traefik.me') }}"
    terrarium_lxd_domain: "{{ ('lxd.' ~ terrarium_root_domain) if terrarium_root_domain else ('lxd.' ~ (terrarium_public_ip | replace('.', '-')) ~ '.traefik.me') }}"
    terrarium_idp_mode: oidc
    terrarium_idp_provider: ""
    terrarium_auth_domain: "{{ (('auth.' ~ terrarium_root_domain) if terrarium_root_domain else ('auth.' ~ (terrarium_public_ip | replace('.', '-')) ~ '.traefik.me')) if terrarium_idp_mode == 'local' else '' }}"
    terrarium_oidc_issuer: "{{ ('https://' ~ terrarium_auth_domain) if terrarium_idp_mode == 'local' else '' }}"
    terrarium_oidc_client_id: ""
    terrarium_oidc_client_secret: ""
    terrarium_oidc_groups_claim: ""
    terrarium_oidc_scopes: ""
    terrarium_lxd_oidc_client_id: ""
    terrarium_lxd_oidc_client_secret: ""
    terrarium_lxd_oidc_groups_claim: ""
    terrarium_lxd_oidc_scopes: ""
    terrarium_admin_group: ""
    terrarium_zitadel_admin_email: "{{ terrarium_email }}"
    terrarium_zitadel_instance_name: terrarium-idp
    terrarium_zitadel_dir: "{{ terrarium_state_dir }}/zitadel"
    terrarium_zitadel_bootstrap_dir: "{{ terrarium_zitadel_dir }}/bootstrap"
    terrarium_logto_instance_name: terrarium-idp
    terrarium_logto_instance_image: ubuntu:24.04
    terrarium_logto_instance_profile: terrarium
    terrarium_logto_dir: "{{ terrarium_state_dir }}/logto"
    terrarium_logto_postgres_dir: "{{ terrarium_logto_dir }}/postgres"
    terrarium_logto_seed_dir: "{{ terrarium_logto_dir }}/seed"
    terrarium_logto_stage_dir: "{{ terrarium_state_dir }}/logto-container"
    terrarium_logto_core_port: 3001
    terrarium_logto_admin_port: 3002
    terrarium_logto_admin_email: "{{ terrarium_email }}"
    terrarium_logto_admin_username: terrarium_admin
    terrarium_local_idp_outputs_path: ""
    terrarium_local_idp_outputs_path_default: /etc/terrarium/idp-apps.json
    terrarium_zitadel_outputs_path: /etc/terrarium/zitadel-apps.json
    terrarium_docker_registry_config_path: /root/.docker/config.json
    terrarium_docker_hardened_images: auto
    terrarium_docker_hardened_image_mirrors: true
    terrarium_oauth2_proxy_image: ""
    terrarium_oauth2_proxy_image_hardened: "dhi.io/oauth2-proxy:7.15.2-debian13@sha256:8f4e89762735e7ec7c3f1bbdd5da4dcd55358db8c3278bfbc2e46a7f86ab7d9e"
    terrarium_oauth2_proxy_image_mirror: "ghcr.io/terion-name/terrarium-dhi-oauth2-proxy:7.15.2-debian13@sha256:e9e04c1aec93e395897ad62625f088bbb8230c440244a4561c76df1305f9b461"
    terrarium_oauth2_proxy_image_fallback: "quay.io/oauth2-proxy/oauth2-proxy:v7.15.2@sha256:aa0bd8dd5ab0c78e4c91c92755ad573a5f92241f88138b4141b8ec803463b4fd"
    terrarium_oauth2_proxy_uid: "65532"
    terrarium_oauth2_proxy_group: terrarium-oauth2-proxy
    terrarium_oauth2_proxy_gid: ""
    terrarium_zitadel_postgres_image: ""
    terrarium_zitadel_postgres_image_hardened: "dhi.io/postgres:17.10-alpine3.22@sha256:a8da88e1ff62d2764fc63b0f1b0f912ff06fc629d964a260d876be615bd0857b"
    terrarium_zitadel_postgres_image_mirror: "ghcr.io/terion-name/terrarium-dhi-postgres:17.10-alpine3.22@sha256:9de93f210670e25bad3dd650ac435067c7628700cc7485fa0d4fe72b8e9d765d"
    terrarium_zitadel_postgres_image_fallback: "postgres:17.9-alpine3.22@sha256:034839bd88128360cda25496ebdb1471e24a4aa09b937160c73df2bb51126308"
    terrarium_logto_app_image: ""
    terrarium_logto_app_image_fallback: "ghcr.io/logto-io/logto:1.42.0@sha256:aac94e24ab7bef59be5d1809b1481b179495aaa75bb9dc2895ceae46e4117854"
    terrarium_logto_postgres_image: ""
    terrarium_logto_postgres_image_hardened: "dhi.io/postgres:17.10-alpine3.22@sha256:a8da88e1ff62d2764fc63b0f1b0f912ff06fc629d964a260d876be615bd0857b"
    terrarium_logto_postgres_image_mirror: "ghcr.io/terion-name/terrarium-dhi-postgres:17.10-alpine3.22@sha256:9de93f210670e25bad3dd650ac435067c7628700cc7485fa0d4fe72b8e9d765d"
    terrarium_logto_postgres_image_fallback: "postgres:17.9-alpine3.22@sha256:034839bd88128360cda25496ebdb1471e24a4aa09b937160c73df2bb51126308"
    terrarium_email: ""
    terrarium_acme_email: "{{ terrarium_email }}"
    terrarium_enable_s3: false
    terrarium_s3_endpoint: https://s3.amazonaws.com
    terrarium_s3_bucket: ""
    terrarium_s3_region: us-east-1
    terrarium_s3_prefix: terrarium
    terrarium_s3_access_key: ""
    terrarium_s3_secret_key: ""
    terrarium_enable_syncoid: false
    terrarium_syncoid_target: ""
    terrarium_syncoid_target_dataset: ""
    terrarium_syncoid_ssh_key: /root/.ssh/id_ed25519
    terrarium_apply_hardening: true
    terrarium_config_bundle:
      terrarium_repo_dir: "{{ terrarium_repo_dir }}"
      terrarium_config_path: "{{ terrarium_config_path }}"
      terrarium_state_dir: "{{ terrarium_state_dir }}"
      terrarium_public_ip: "{{ terrarium_public_ip }}"
      terrarium_root_domain: "{{ terrarium_root_domain }}"
      terrarium_email: "{{ terrarium_email }}"
      terrarium_acme_email: "{{ terrarium_acme_email }}"
      terrarium_manage_domain: "{{ terrarium_manage_domain }}"
      terrarium_proxy_domain: "{{ terrarium_proxy_domain }}"
      terrarium_lxd_domain: "{{ terrarium_lxd_domain }}"
      terrarium_idp_mode: "{{ terrarium_idp_mode }}"
      terrarium_idp_provider: "{{ terrarium_idp_provider_effective | default(terrarium_idp_provider) }}"
      terrarium_auth_domain: "{{ terrarium_auth_domain }}"
      terrarium_oidc_issuer: "{{ terrarium_oidc_issuer_effective | default(terrarium_oidc_issuer) }}"
      terrarium_oidc_client_id: "{{ terrarium_oidc_client_id }}"
      terrarium_oidc_client_secret: "{{ terrarium_oidc_client_secret }}"
      terrarium_oidc_groups_claim: "{{ terrarium_oidc_groups_claim_effective | default(terrarium_oidc_groups_claim) }}"
      terrarium_oidc_scopes: "{{ terrarium_oidc_scopes_effective | default(terrarium_oidc_scopes) }}"
      terrarium_lxd_oidc_client_id: "{{ terrarium_lxd_oidc_client_id }}"
      terrarium_lxd_oidc_client_secret: "{{ terrarium_lxd_oidc_client_secret }}"
      terrarium_lxd_oidc_groups_claim: "{{ terrarium_lxd_oidc_groups_claim_effective | default(terrarium_lxd_oidc_groups_claim) }}"
      terrarium_lxd_oidc_scopes: "{{ terrarium_lxd_oidc_scopes_effective | default(terrarium_lxd_oidc_scopes) }}"
      terrarium_admin_group: "{{ terrarium_admin_group }}"
      terrarium_zitadel_admin_email: "{{ terrarium_zitadel_admin_email }}"
      terrarium_zitadel_instance_name: "{{ terrarium_zitadel_instance_name }}"
      terrarium_zitadel_dir: "{{ terrarium_zitadel_dir }}"
      terrarium_zitadel_bootstrap_dir: "{{ terrarium_zitadel_bootstrap_dir }}"
      terrarium_logto_instance_name: "{{ terrarium_logto_instance_name }}"
      terrarium_logto_instance_image: "{{ terrarium_logto_instance_image }}"
      terrarium_logto_instance_profile: "{{ terrarium_logto_instance_profile }}"
      terrarium_logto_dir: "{{ terrarium_logto_dir }}"
      terrarium_logto_postgres_dir: "{{ terrarium_logto_postgres_dir }}"
      terrarium_logto_seed_dir: "{{ terrarium_logto_seed_dir }}"
      terrarium_logto_stage_dir: "{{ terrarium_logto_stage_dir }}"
      terrarium_logto_core_port: "{{ terrarium_logto_core_port }}"
      terrarium_logto_admin_port: "{{ terrarium_logto_admin_port }}"
      terrarium_logto_admin_email: "{{ terrarium_logto_admin_email }}"
      terrarium_logto_admin_username: "{{ terrarium_logto_admin_username }}"
      terrarium_local_idp_outputs_path: "{{ terrarium_local_idp_outputs_path_effective | default(terrarium_local_idp_outputs_path) }}"
      terrarium_zitadel_outputs_path: "{{ terrarium_zitadel_outputs_path_effective | default(terrarium_zitadel_outputs_path) }}"
      terrarium_oauth2_proxy_image: "{{ terrarium_oauth2_proxy_image_effective | default(terrarium_oauth2_proxy_image_fallback) }}"
      terrarium_oauth2_proxy_uid: "{{ terrarium_oauth2_proxy_uid }}"
      terrarium_oauth2_proxy_group: "{{ terrarium_oauth2_proxy_group }}"
      terrarium_oauth2_proxy_gid: "{{ terrarium_oauth2_proxy_gid_effective | default(terrarium_oauth2_proxy_gid) }}"
      terrarium_zitadel_postgres_image: "{{ terrarium_zitadel_postgres_image_effective | default(terrarium_zitadel_postgres_image_fallback) }}"
      terrarium_logto_app_image: "{{ terrarium_logto_app_image_effective | default(terrarium_logto_app_image_fallback) }}"
      terrarium_logto_postgres_image: "{{ terrarium_logto_postgres_image_effective | default(terrarium_logto_postgres_image_fallback) }}"
      terrarium_local_idp_discovery_url: "{{ terrarium_local_idp_discovery_url_effective | default('') }}"
      terrarium_lxd_pool_name: "{{ terrarium_lxd_pool_name }}"
      terrarium_cluster_enabled: "{{ terrarium_cluster_enabled }}"
      terrarium_cluster_peer_cidrs: "{{ terrarium_cluster_peer_cidrs }}"
      terrarium_cluster_pending_peer_invites: "{{ terrarium_cluster_pending_peer_invites }}"
      terrarium_cluster_wireguard_enabled: "{{ terrarium_cluster_wireguard_enabled }}"
      terrarium_cluster_wireguard_interface: "{{ terrarium_cluster_wireguard_interface }}"
      terrarium_cluster_wireguard_cidr: "{{ terrarium_cluster_wireguard_cidr }}"
      terrarium_cluster_wireguard_port: "{{ terrarium_cluster_wireguard_port }}"
      terrarium_cluster_wireguard_members: "{{ terrarium_cluster_wireguard_members }}"
      terrarium_cluster_wireguard_endpoint_cidrs: "{{ terrarium_cluster_wireguard_endpoint_cidrs }}"
      terrarium_cluster_pending_wireguard_invites: "{{ terrarium_cluster_pending_wireguard_invites }}"
      terrarium_lxd_network_parent: "{{ terrarium_lxd_network_parent }}"
      terrarium_lxd_network_name: "{{ terrarium_lxd_network_name }}"
      terrarium_lxd_parent_ipv4: "{{ terrarium_lxd_parent_ipv4 }}"
      terrarium_lxd_parent_dhcp_range: "{{ terrarium_lxd_parent_dhcp_range }}"
      terrarium_lxd_parent_ovn_range: "{{ terrarium_lxd_parent_ovn_range }}"
      terrarium_ovn_central_addresses: "{{ terrarium_ovn_central_addresses }}"
      terrarium_ovn_ca_cert: "{{ terrarium_ovn_ca_cert }}"
      terrarium_ovn_ca_key: "{{ terrarium_ovn_ca_key }}"
      terrarium_storage_mode: "{{ terrarium_storage_mode }}"
      terrarium_storage_source: "{{ terrarium_storage_source }}"
      terrarium_storage_size: "{{ terrarium_storage_size }}"
      terrarium_storage_partition_start: "{{ terrarium_storage_partition_start }}"
      terrarium_storage_partition_end: "{{ terrarium_storage_partition_end }}"
      terrarium_enable_s3: "{{ terrarium_enable_s3 }}"
      terrarium_s3_endpoint: "{{ terrarium_s3_endpoint }}"
      terrarium_s3_bucket: "{{ terrarium_s3_bucket }}"
      terrarium_s3_region: "{{ terrarium_s3_region }}"
      terrarium_s3_prefix: "{{ terrarium_s3_prefix }}"
      terrarium_s3_access_key: "{{ terrarium_s3_access_key }}"
      terrarium_s3_secret_key: "{{ terrarium_s3_secret_key }}"
      terrarium_enable_syncoid: "{{ terrarium_enable_syncoid }}"
      terrarium_syncoid_target: "{{ terrarium_syncoid_target }}"
      terrarium_syncoid_target_dataset: "{{ terrarium_syncoid_target_dataset }}"
      terrarium_syncoid_ssh_key: "{{ terrarium_syncoid_ssh_key }}"
  pre_tasks:
    - name: Assert supported Ubuntu LTS
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version in ['24.04', '26.04']
        fail_msg: Terrarium supports Ubuntu 24.04 and 26.04 LTS.
    - name: Check Docker registry credentials for hardened images
      ansible.builtin.stat:
        path: "{{ terrarium_docker_registry_config_path }}"
      register: terrarium_docker_registry_config
      no_log: true
    - name: Resolve hardened image preference
      ansible.builtin.set_fact:
        terrarium_docker_hardened_images_effective: >-
          {{
            (terrarium_docker_hardened_images | string | lower) in ['true', 'yes', '1']
            or (
              (terrarium_docker_hardened_images | string | lower) == 'auto'
              and terrarium_docker_registry_config.stat.exists
            )
          }}
      no_log: true
    - name: Resolve hardened image mirror preference
      ansible.builtin.set_fact:
        terrarium_docker_hardened_image_mirrors_effective: >-
          {{
            (terrarium_docker_hardened_images | string | lower) not in ['false', 'no', '0']
            and (terrarium_docker_hardened_image_mirrors | string | lower) in ['true', 'yes', '1', 'auto']
          }}
      no_log: true
    - name: Resolve IdP provider default
      ansible.builtin.set_fact:
        terrarium_idp_provider_effective: >-
          {{
            (terrarium_idp_provider | default('', true) | string | trim | lower)
            if (terrarium_idp_provider | default('', true) | string | trim | length > 0)
            else ('zitadel' if terrarium_idp_mode == 'local' else 'generic')
          }}
    - name: Resolve OIDC claim and scope defaults
      ansible.builtin.set_fact:
        terrarium_oidc_groups_claim_effective: >-
          {{
            (terrarium_oidc_groups_claim | default('', true) | string | trim)
            if (terrarium_oidc_groups_claim | default('', true) | string | trim | length > 0)
            else ('roles' if terrarium_idp_provider_effective == 'logto' else 'groups')
          }}
        terrarium_oidc_scopes_effective: >-
          {{
            (terrarium_oidc_scopes | default('', true) | string | trim)
            if (terrarium_oidc_scopes | default('', true) | string | trim | length > 0)
            else ('openid profile email roles' if terrarium_idp_provider_effective == 'logto' else 'openid profile email')
          }}
    - name: Resolve LXD OIDC claim and scope defaults
      ansible.builtin.set_fact:
        terrarium_lxd_oidc_groups_claim_effective: >-
          {{
            (terrarium_lxd_oidc_groups_claim | default('', true) | string | trim)
            if (terrarium_lxd_oidc_groups_claim | default('', true) | string | trim | length > 0)
            else terrarium_oidc_groups_claim_effective
          }}
        terrarium_lxd_oidc_scopes_effective: >-
          {{
            (terrarium_lxd_oidc_scopes | default('', true) | string | trim)
            if (terrarium_lxd_oidc_scopes | default('', true) | string | trim | length > 0)
            else terrarium_oidc_scopes_effective
          }}
    - name: Resolve local IdP output path
      ansible.builtin.set_fact:
        terrarium_local_idp_outputs_path_effective: >-
          {{
            (terrarium_local_idp_outputs_path | default('', true) | string | trim)
            if (terrarium_local_idp_outputs_path | default('', true) | string | trim | length > 0)
            else (
              terrarium_local_idp_outputs_path_default
              if terrarium_idp_provider_effective == 'logto'
              else (terrarium_zitadel_outputs_path | default('/etc/terrarium/zitadel-apps.json', true))
            )
          }}
        terrarium_zitadel_outputs_path_effective: >-
          {{
            (terrarium_local_idp_outputs_path | default('', true) | string | trim)
            if (terrarium_local_idp_outputs_path | default('', true) | string | trim | length > 0)
            else (terrarium_zitadel_outputs_path | default('/etc/terrarium/zitadel-apps.json', true))
          }}
    - name: Resolve container image defaults
      ansible.builtin.set_fact:
        terrarium_oidc_issuer_effective: >-
          {{
            ('https://' ~ terrarium_auth_domain ~ '/oidc')
            if (terrarium_idp_mode == 'local' and terrarium_idp_provider_effective == 'logto')
            else (
              ('https://' ~ terrarium_auth_domain)
              if terrarium_idp_mode == 'local'
              else terrarium_oidc_issuer
            )
          }}
        terrarium_local_idp_discovery_url_effective: >-
          {{
            ('https://' ~ terrarium_auth_domain ~ '/oidc/.well-known/openid-configuration')
            if (terrarium_idp_mode == 'local' and terrarium_idp_provider_effective == 'logto')
            else (
              ('https://' ~ terrarium_auth_domain ~ '/.well-known/openid-configuration')
              if terrarium_idp_mode == 'local'
              else ((terrarium_oidc_issuer | regex_replace('/+$', '')) ~ '/.well-known/openid-configuration')
            )
          }}
        terrarium_oauth2_proxy_image_effective: >-
          {{
            terrarium_oauth2_proxy_image
            if (terrarium_oauth2_proxy_image | default('', true) | length > 0)
            else (
              terrarium_oauth2_proxy_image_hardened
              if terrarium_docker_hardened_images_effective
              else (
                terrarium_oauth2_proxy_image_mirror
                if terrarium_docker_hardened_image_mirrors_effective
                else terrarium_oauth2_proxy_image_fallback
              )
            )
          }}
        terrarium_zitadel_postgres_image_effective: >-
          {{
            terrarium_zitadel_postgres_image
            if (terrarium_zitadel_postgres_image | default('', true) | length > 0)
            else (
              terrarium_zitadel_postgres_image_hardened
              if terrarium_docker_hardened_images_effective
              else (
                terrarium_zitadel_postgres_image_mirror
                if terrarium_docker_hardened_image_mirrors_effective
                else terrarium_zitadel_postgres_image_fallback
              )
            )
          }}
        terrarium_logto_app_image_effective: >-
          {{
            terrarium_logto_app_image
            if (terrarium_logto_app_image | default('', true) | length > 0)
            else terrarium_logto_app_image_fallback
          }}
        terrarium_logto_postgres_image_effective: >-
          {{
            terrarium_logto_postgres_image
            if (terrarium_logto_postgres_image | default('', true) | length > 0)
            else (
              terrarium_logto_postgres_image_hardened
              if terrarium_docker_hardened_images_effective
              else (
                terrarium_logto_postgres_image_mirror
                if terrarium_docker_hardened_image_mirrors_effective
                else terrarium_logto_postgres_image_fallback
              )
            )
          }}
      no_log: true
    - name: Ensure oauth2-proxy host group
      ansible.builtin.group:
        name: "{{ terrarium_oauth2_proxy_group }}"
        gid: "{{ (terrarium_oauth2_proxy_gid | default('', true) | string | length > 0) | ternary(terrarium_oauth2_proxy_gid, omit) }}"
        system: true
        state: present
      when: terrarium_idp_mode in ['local', 'oidc']
    - name: Resolve oauth2-proxy host group
      ansible.builtin.getent:
        database: group
        key: "{{ terrarium_oauth2_proxy_group }}"
      when: terrarium_idp_mode in ['local', 'oidc']
    - name: Set oauth2-proxy host GID
      ansible.builtin.set_fact:
        terrarium_oauth2_proxy_gid_effective: "{{ ansible_facts.getent_group[terrarium_oauth2_proxy_group][1] }}"
      when: terrarium_idp_mode in ['local', 'oidc']
    - name: Default local management admin group
      ansible.builtin.set_fact:
        terrarium_admin_group: terrarium-admins
      when:
        - terrarium_idp_mode == 'local'
        - terrarium_admin_group | default('') | length == 0
    - name: Refresh config bundle with resolved admin group
      ansible.builtin.set_fact:
        terrarium_config_bundle: >-
          {{
            terrarium_config_bundle | combine({
              'terrarium_idp_provider': terrarium_idp_provider_effective,
              'terrarium_oidc_groups_claim': terrarium_oidc_groups_claim_effective,
              'terrarium_oidc_scopes': terrarium_oidc_scopes_effective,
              'terrarium_lxd_oidc_groups_claim': terrarium_lxd_oidc_groups_claim_effective,
              'terrarium_lxd_oidc_scopes': terrarium_lxd_oidc_scopes_effective,
              'terrarium_local_idp_outputs_path': terrarium_local_idp_outputs_path_effective,
              'terrarium_zitadel_outputs_path': terrarium_zitadel_outputs_path_effective,
              'terrarium_admin_group': terrarium_admin_group,
              'terrarium_oidc_issuer': terrarium_oidc_issuer_effective,
              'terrarium_oauth2_proxy_image': terrarium_oauth2_proxy_image_effective,
              'terrarium_oauth2_proxy_uid': terrarium_oauth2_proxy_uid,
              'terrarium_oauth2_proxy_group': terrarium_oauth2_proxy_group,
              'terrarium_oauth2_proxy_gid': terrarium_oauth2_proxy_gid_effective | default(terrarium_oauth2_proxy_gid),
              'terrarium_zitadel_postgres_image': terrarium_zitadel_postgres_image_effective,
              'terrarium_logto_instance_name': terrarium_logto_instance_name,
              'terrarium_logto_instance_image': terrarium_logto_instance_image,
              'terrarium_logto_instance_profile': terrarium_logto_instance_profile,
              'terrarium_logto_dir': terrarium_logto_dir,
              'terrarium_logto_postgres_dir': terrarium_logto_postgres_dir,
              'terrarium_logto_seed_dir': terrarium_logto_seed_dir,
              'terrarium_logto_stage_dir': terrarium_logto_stage_dir,
              'terrarium_logto_core_port': terrarium_logto_core_port,
              'terrarium_logto_admin_port': terrarium_logto_admin_port,
              'terrarium_logto_admin_email': terrarium_logto_admin_email,
              'terrarium_logto_admin_username': terrarium_logto_admin_username,
              'terrarium_logto_app_image': terrarium_logto_app_image_effective,
              'terrarium_logto_postgres_image': terrarium_logto_postgres_image_effective,
              'terrarium_local_idp_discovery_url': terrarium_local_idp_discovery_url_effective
            })
          }}
      no_log: true
  roles:
    - role: base
    - role: zfs
    - role: cockpit
    - role: cockpit_plugins
    - role: traefik
    - role: lxd
    - role: idp_zitadel
    - role: idp_logto
      when:
        - terrarium_idp_mode == 'local'
        - terrarium_idp_provider_effective == 'logto'
    - role: oauth2_proxy
    - role: backups
    - role: hardening
      when: terrarium_apply_hardening | bool
  post_tasks:
    - name: Import config export into the LXD dqlite store
      ansible.builtin.command: /usr/local/bin/terrariumctl config import
      changed_when: false
      no_log: true

    - name: Remove transient local config export after dqlite import
      ansible.builtin.file:
        path: "{{ terrarium_config_path }}"
        state: absent
      no_log: true

    - name: Run Traefik sync after all dependent services are configured
      ansible.builtin.command: /usr/local/bin/terrariumctl proxy sync
      register: terrarium_post_proxy_sync
      retries: 12
      delay: 10
      until: terrarium_post_proxy_sync.rc == 0
      changed_when: false

    - name: Retire local auth bootstrap TLS before verifying public TLS
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ terrarium_traefik_config_dir }}/dynamic/bootstrap-routes.yml"
        - "{{ terrarium_traefik_config_dir }}/dynamic/bootstrap-cert.yml"
        - "{{ terrarium_traefik_config_dir }}/bootstrap-certs"
        - /usr/local/share/ca-certificates/terrarium-bootstrap.crt
      register: terrarium_bootstrap_tls_retired
      when:
        - terrarium_idp_mode == 'local'
        - terrarium_auth_domain | default('') | length > 0

    - name: Refresh system CA certificates after retiring bootstrap TLS
      ansible.builtin.command: update-ca-certificates
      changed_when: terrarium_bootstrap_tls_retired is changed
      when: terrarium_bootstrap_tls_retired is changed

    - name: Restart Traefik after retiring bootstrap TLS
      ansible.builtin.systemd:
        name: traefik
        state: restarted
      when: terrarium_bootstrap_tls_retired is changed

    - name: Wait for local auth domain to serve public TLS
      ansible.builtin.command:
        argv:
          - curl
          - -fsS
          - --noproxy
          - "*"
          - --resolve
          - "{{ terrarium_auth_domain }}:443:127.0.0.1"
          - --connect-timeout
          - "10"
          - --max-time
          - "20"
          - "{{ terrarium_local_idp_discovery_url_effective }}"
      register: terrarium_auth_public_tls
      retries: 36
      delay: 10
      until: terrarium_auth_public_tls.rc == 0
      changed_when: false
      failed_when: false
      when:
        - terrarium_idp_mode == 'local'
        - terrarium_auth_domain | default('') | length > 0

    - name: Restart Traefik to retry local auth ACME after public TLS wait failure
      ansible.builtin.systemd:
        name: traefik
        state: restarted
      when:
        - terrarium_idp_mode == 'local'
        - terrarium_auth_domain | default('') | length > 0
        - terrarium_auth_public_tls is defined
        - terrarium_auth_public_tls.rc | default(0) != 0

    - name: Wait again for local auth domain to serve public TLS after ACME retry
      ansible.builtin.command:
        argv:
          - curl
          - -fsS
          - --noproxy
          - "*"
          - --resolve
          - "{{ terrarium_auth_domain }}:443:127.0.0.1"
          - --connect-timeout
          - "10"
          - --max-time
          - "20"
          - "{{ terrarium_local_idp_discovery_url_effective }}"
      register: terrarium_auth_public_tls_retry
      retries: 36
      delay: 10
      until: terrarium_auth_public_tls_retry.rc == 0
      changed_when: false
      failed_when: false
      when:
        - terrarium_idp_mode == 'local'
        - terrarium_auth_domain | default('') | length > 0
        - terrarium_auth_public_tls is defined
        - terrarium_auth_public_tls.rc | default(0) != 0

    - name: Select local auth public TLS wait result
      ansible.builtin.set_fact:
        terrarium_auth_public_tls_effective: >-
          {{
            terrarium_auth_public_tls_retry
            if (
              (terrarium_auth_public_tls.rc | default(1)) != 0
              and terrarium_auth_public_tls_retry is defined
            )
            else terrarium_auth_public_tls
          }}
      when:
        - terrarium_idp_mode == 'local'
        - terrarium_auth_domain | default('') | length > 0
        - terrarium_auth_public_tls is defined

    - name: Show local auth TLS diagnostics after public TLS failure
      ansible.builtin.shell: |
        set +e
        echo "== presented certificate =="
        timeout 10s openssl s_client -connect 127.0.0.1:443 -servername "$TERRARIUM_AUTH_DOMAIN" -showcerts </dev/null 2>/dev/null \
          | openssl x509 -noout -subject -issuer -ext subjectAltName 2>&1 || true
        echo
        echo "== Traefik static TLS resolver config =="
        sed -n '/certificatesResolvers:/,$p' "$TERRARIUM_TRAEFIK_CONFIG_DIR/traefik.yml" 2>&1 || true
        echo
        echo "== recent Traefik ACME logs =="
        journalctl -u traefik --no-pager -n 300 2>&1 | grep -Ei 'acme|certificate|challenge|letsencrypt|unable|error|self-signed' || true
      environment:
        TERRARIUM_AUTH_DOMAIN: "{{ terrarium_auth_domain }}"
        TERRARIUM_TRAEFIK_CONFIG_DIR: "{{ terrarium_traefik_config_dir }}"
      changed_when: false
      when:
        - terrarium_idp_mode == 'local'
        - terrarium_auth_domain | default('') | length > 0
        - terrarium_auth_public_tls_effective is defined
        - terrarium_auth_public_tls_effective.rc | default(0) != 0

    - name: Warn when local auth domain still does not serve public TLS
      ansible.builtin.debug:
        msg: "Local auth domain {{ terrarium_auth_domain }} does not serve public TLS yet after retiring bootstrap TLS; Traefik ACME will keep retrying, and diagnostics are shown above."
      when:
        - terrarium_idp_mode == 'local'
        - terrarium_auth_domain | default('') | length > 0
        - terrarium_auth_public_tls_effective is defined
        - terrarium_auth_public_tls_effective.rc | default(0) != 0

    - name: Enable Traefik sync timer after dependent services are configured
      ansible.builtin.systemd:
        name: terrarium-traefik-sync.timer
        state: started
        enabled: true
        daemon_reload: true
